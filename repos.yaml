# Vendor manifest.
#
# Paddock drives these repositories but does not vendor them: no upstream source
# is copied into this repo. `paddock setup` clones what is missing into
# [roots.repos] and adopts what is already there, then applies any patches.
#
# Pin a sha. A floating ref means two sites can produce different numbers from
# the same command and never find out why.
#
# `patches` lists files under patches/<name>/, applied in order. Use one only
# where a repo cannot be configured externally -- see docs/adding-a-model.md.

repos:
  openpilot:
    url: https://github.com/commaai/openpilot.git
    sha: 555f48c5d
    description: comma.ai openpilot; supercombo driving model via tinygrad

  comma2k19:
    url: https://github.com/commaai/comma2k19.git
    sha: 4c7f1a6e1
    description: comma2k19 dataset toolkit; the ECEF pose maths and EON camera model under adapters/benchmarks/comma2k19

  sunnypilot:
    url: https://github.com/sunnypilot/sunnypilot.git
    sha: 0b1ed0d047
    description: openpilot fork; not yet evaluated

  alpamayo1.5:
    url: https://github.com/NVlabs/alpamayo1.5.git
    sha: 7a8f1c7
    description: NVIDIA Alpamayo 1.5 VQA-10B trajectory model

  alpamayo2:
    url: https://github.com/NVlabs/alpamayo2.git
    sha: beb2977
    description: NVIDIA Alpamayo 2 Super (34B); not yet evaluated

  alpasim:
    url: https://github.com/NVlabs/alpasim.git
    sha: affc2ea
    description: NVIDIA AlpaSim closed-loop driving simulator; drivers attach over gRPC, so paddock needs no patch

  Drive-JEPA:
    url: https://github.com/linhanwang/Drive-JEPA.git
    sha: e21f474
    description: V-JEPA driving policy with the NAVSIM devkits vendored under navsim_v1/ and navsim_v2/
    patches:
      - 0001-msda-compat-for-newer-gpus.patch
      - 0002-score-runs-with-failed-scenarios.patch
      - 0003-navsim-v1-camera-path.patch

  neuro-ncap:
    url: https://github.com/atonderski/neuro-ncap
    sha: ecdcf28
    description: closed-loop NCAP harness; drives a model node over HTTP
    patches:
      - 0001-waypoint-dt-and-camera-selection.patch
      - 0002-fail-loudly-on-renderer-http-errors.patch
      - 0003-optional-debug-views.patch

  Bench2Drive:
    url: https://github.com/Thinklab-SJTU/Bench2Drive.git
    sha: 7ec25d1
    description: CARLA 0.9.15 closed-loop leaderboard (release 0.0.4); driven by adapters/benchmarks/bench2drive
    patches:
      - 0001-kill-only-own-carla-on-crash.patch
      - 0002-connect-timeout-for-a-booting-server.patch

  HUGSIM:
    url: https://github.com/hyzhou404/HUGSIM.git
    sha: 62c690d
    description: HUGSIM closed-loop simulator on Gaussian-splatting scenes; driven by adapters/benchmarks/hugsim
    patches:
      - 0001-traj2control-heading-pr57.patch
      - 0002-render-only-requested-cameras.patch

  kitscenes:
    url: https://github.com/KIT-MRT/kitscenes.git
    sha: 7765cde
    description: KITScenes dataset API and downloader

  vision_pilot:
    url: https://github.com/autowarefoundation/vision_pilot.git
    sha: e93eceaa
    description: Autoware VisionPilot; C++ ONNX Runtime stack with an MPC planner

  vjepa2:
    url: https://github.com/facebookresearch/vjepa2.git
    sha: 204698b
    description: V-JEPA 2 encoder; vendored inside Drive-JEPA, not run standalone

  auto_e2e:
    url: https://github.com/autowarefoundation/auto_e2e.git
    sha: 40a75cf8
    description: Autoware AutoE2E; the v1.0 release revision (experimental/reactive-bev-learning), imported by the autoe2e adapter

  METEOR:
    url: https://github.com/tier4/METEOR.git
    sha: dc193a81
    description: TIER IV METEOR surround-view multi-task network with an E2E planning head; run from the released ONNX

  Qwen-Drive-1.0:
    url: https://github.com/QwenLM/Qwen-Drive-1.0.git
    sha: 28091c1
    description: Qwen-Drive-1.0-4B inference code; Qwen3.5 VLM with a flow-matching planning expert and BEV perception head, imported as a library from src/

  cosmos-framework:
    url: https://github.com/NVIDIA/cosmos-framework.git
    sha: efba207
    description: Cosmos 3 inference; the video2video transfer mode is the sim2real converter (docs/sim2real/cosmos3.md). Pod-only, no adapter imports it

  flashdreams:
    url: https://github.com/NVIDIA/flashdreams.git
    sha: 6e2d3ad
    description: OmniDreams world model plus the ludus_renderer map rasteriser used for the sim2real map control. Pod-only

  WA-JEPA:
    url: https://github.com/AFARI-Research/WA-JEPA.git
    sha: bec2966
    description: AFARI WA-JEPA world-action model (V-JEPA 2.1 ViT-L + joint flow predictor); the adapter imports the model package and upstream's HUGSIM client helpers, nothing from NAVSIM
