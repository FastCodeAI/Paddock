# What each dataset IS -- never where it lives.
#
# Locations go in paddock.toml, which is gitignored, because they differ at
# every site. `requires` lists subdirectories that must be present under the
# resolved root; `paddock doctor` checks them and reports what a gap blocks.
#
# `fetch`, where present, is where the dataset comes from, for
# `paddock data fetch` (src/paddock/fetch.py says how each key is read). It names
# the owner's own host at a pinned revision, never a copy of ours, and only the
# files a benchmark scores: the evaluation split, cameras only. `terms` makes
# the command refuse until the user passes --accept-terms.

datasets:
  nuscenes:
    description: nuScenes v1.0 -- scene source for neuroNCAP, and planned open-loop ADE
    requires: [samples, maps, v1.0-trainval]
    splits: [train, val, test]
    notes: >
      Camera-only pipelines need samples/CAM_* and the v1.0-trainval metadata.
      Anything using lidar or radar additionally needs sweeps/ and populated
      RADAR_* directories, which keyframe-only copies do not have. Generating
      nuscenes_infos*.pkl against a keyframe-only copy will degrade silently.

  kitscenes:
    description: KITScenes multimodal driving dataset -- open-loop ADE/FDE
    splits: [train, val, test, test-e2e, overlap_train_val]
    notes: >
      Declare tiers fastest-first in paddock.toml; a pruned NVMe working set can
      front a full archive. Note the full release is ~4.2 TB across 1006
      sequences, so most sites hold a subset -- `paddock doctor` reports which
      sequences the configured tiers can actually serve.

  navsim:
    description: NAVSIM on OpenScene (a 2 Hz redistribution of nuPlan, not nuScenes) -- closed-loop-proxy scoring as v1.1 PDMS (navsim_v1) or v2 EPDMS (navsim)
    requires: [navsim_logs, sensor_blobs, maps]
    notes: >
      Single-stage evaluation (navtest: 136 logs, 12,146 real scenes) needs only
      the test logs, camera blobs and maps. Each devkit generation needs its own
      metric cache ([benchmarks.navsim] and [benchmarks.navsim_v1] metric_cache
      in paddock.toml); the pickles are not interchangeable, and
      tools/benchmarks/navsim/build_metric_cache.py builds either from the logs
      and maps. The two-stage splits that the NAVSIM
      v2 leaderboard reports (navhard / navsafe two-stage) additionally need
      synthetic_scenes/, a separate download; EPDMS on navtest is the same metric
      on different, easier data and is not comparable to those figures. Training
      needs navtrain / trainval_sensor, another separate and much larger download.
    fetch:
      license: CC BY-NC-SA 4.0, non-commercial use only (OpenScene, and nuPlan's maps)
      terms: https://www.nuscenes.org/terms-of-use
      huggingface: {repo: OpenDriveLab/OpenScene, revision: a76f840b65e972bc45e56c2adced897498e9a026}
      parts:
        # One .pkl per log. NAVSIM builds its scene list from these, not from the
        # images, so without them the cameras below score nothing.
        metadata:
          files: [openscene-v1.1/openscene_metadata_test.tgz]
          into: navsim_logs/test
          strip: 3  # openscene-v1.1/meta_datas/test/<log>.pkl
        # The test split's 147 logs; navtest scores 136 of them. The lidar shards
        # beside these are as large again, and no model here reads lidar.
        cameras:
          files: [openscene-v1.1/openscene_sensor_test_camera/openscene_sensor_test_camera_*.tgz]
          into: sensor_blobs/test
          strip: 3  # openscene-v1.1/sensor_blobs/test/<log>/<CAM>/*.jpg
        # NAVSIM's own download_maps.sh fetches this same zip and renames its
        # nuplan-maps-v1.0/ to maps/.
        maps:
          url: https://motional-nuplan.s3-ap-northeast-1.amazonaws.com/public/nuplan-v1.1/nuplan-maps-v1.1.zip
          size: 970997691
          sha256: 444860429f9a3bcf89a6459d683fa82eb9219aa259d8d9b8cdefdb37f0b56b05
          into: maps
          strip: 1
      after: >
        NAVSIM also scores in its own devkit, from a metric cache built from these
        logs: see docs/benchmarks/navsim.md and docs/benchmarks/navsim_v1.md for the
        devkit and `python -m tools.benchmarks.navsim.build_metric_cache`.

  nuplan:
    description: nuPlan v1.1 -- the original 10 Hz camera logs behind NAVSIM's OpenScene; open-loop ADE/FDE
    requires: [nuplan-v1.1, maps]
    splits: [mini, trainval, test]
    notes: >
      The logs (13 GB for mini) and the camera blobs (~450 GB, one shard per
      split) are separate downloads, and holding the first without the second is
      the normal half-way state -- `paddock doctor` reports it, because scenario
      selection and ground truth work from the logs alone but no model can be
      scored without the images. Two directory layouts are in the wild: nuPlan
      documents nuplan-v1.1/splits/<split>, while the mini archive on S3 unpacks
      to nuplan-v1.1/splits/data/cache/<split>; both are searched. Unlike the
      2 Hz OpenScene redistribution under [datasets.navsim], these logs keep the
      native 10 Hz cameras and 100 Hz ego poses, so models that infer ego motion
      from frame-to-frame change can be scored here.

  neurad_checkpoints:
    description: per-scene NeuRAD renderer checkpoints, required by neuroNCAP
    notes: >
      One checkpoint per nuScenes sequence. A scenario whose scene has no
      checkpoint cannot be rendered and will fail at run time, not at setup.

  hugsim:
    description: HUGSIM release -- Gaussian-splatting scenes, vehicle assets and 436 closed-loop scenarios over KITTI-360, nuScenes, PandaSet and Waymo
    requires: [scenarios, scenes, 3DRealCar]
    splits: [kitti360, nuscenes, pandaset, waymo]
    notes: >
      XDimLab/HUGSIM on Hugging Face (public, MIT): scenarios.zip unpacked to
      scenarios/<dataset>/*.yaml, each scene zip to scenes/<dataset>/<scene>/
      (scene.pth, cfg.yaml, ground and point-cloud assets), and the 3DRealCar
      vehicles to 3DRealCar/<car_id>/{gs.pth,wlh.json}. 61 GB in all. A scenario
      whose scene or vehicles are missing fails when the environment is built,
      not before. The released scenarios name each vehicle
      '<car_id>/postprocess/shadow.pth' and the released assets do not match
      that; paddock's launcher repairs a copy per run and never edits the data.
      The 16 nuScenes scenarios with load_HD_map: true also need the release's
      nusc_map_cache, which HUGSIM reads from ~/.unified_data_cache only.
    fetch:
      license: MIT
      huggingface: {repo: XDimLab/HUGSIM, revision: 38433e301bef99dca09f7bbd10f3145449fb66a2}
      parts:
        scenarios:
          files: [scenarios.zip]
          into: scenarios  # the zip holds kitti360/ nuscenes/ pandaset/ waymo/
        scenes:
          files: ["scenes/*/*.zip"]  # each unpacks beside itself: scenes/<dataset>/<scene>/
        vehicles:
          files: ["3DRealCar/*/*"]  # 3DRealCar/<car_id>/{gs.pth,wlh.json}
        map_cache:
          files: [nusc_map_cache.zip]
      after: >
        HUGSIM reads the nuScenes map cache only from ~/.unified_data_cache, so link
        it there: ln -s {dest}/nusc_map_cache ~/.unified_data_cache

  openlane_sample:
    description: short OpenLane clips (video + speed trace) used to smoke-test VisionPilot

  comma2k19:
    description: comma.ai comma2k19 -- 33 hours of 20 Hz highway driving -- open-loop ADE/FDE
    requires: [Chunk_1]
    splits: [rav4, civic]
    notes: >
      Point this at raw_data/ (Chunk_1..10/<dongle_id>|<start_time>/<segment>/), not the
      sibling data/ or compression_challenge/ directories the HuggingFace redistribution
      also ships -- those are a small parquet sample and a separate video-codec contest,
      not this dataset.

      Ground truth needs no post-processing: every segment carries
      global_pose/frame_{times,positions,orientations,velocities}, an INS/GNSS/vision-fused
      ECEF track with one row per video frame. The quaternion in frame_orientations is
      ecef_from_device, NOT device_from_ecef -- the dataset README states this backwards and
      comma2k19's own utils/camera.py transposes before use. Getting it wrong raises no error;
      it mirrors every relative position through the direction of travel.

      video.hevc is a raw HEVC elementary stream with no per-frame images and no container
      index, so decode is sequential and single-pass; the harness streams frames and caches
      nothing to disk. Needs PyAV in paddock's environment or PADDOCK_FFMPEG pointing at an
      ffmpeg binary.

      Native camera rate is 20 Hz -- measured 19.95 Hz from frame_times, and equal to
      openpilot's ModelConstants.MODEL_RUN_FREQ, so nothing needs resampling. The HEVC
      container claims 25 fps and a frame count of 0; both are wrong, and frame_times is
      authoritative.

      There are no lane-line, road-edge or object labels. CAN radar is the only object
      ground truth, and it is a stream of individual tracked points with no lead label.
      There is no published model-evaluation protocol either -- comma2k19's own benchmark
      scores GNSS positioning, not driving models -- so this benchmark defines its metrics;
      see docs/benchmarks/comma2k19.md.
    fetch:
      license: MIT
      huggingface: {repo: commaai/comma2k19, revision: 4bff77c7254c654c28d4c2726186b4e825adccee}
      parts:
        # All ten chunks are the benchmark's 10,165 samples; --match Chunk_1.zip
        # takes one (8.7 GB) for a first score. Each unpacks to <dest>/Chunk_N/,
        # so <dest> is what [datasets.comma2k19] path points at.
        raw_data:
          files: ["raw_data/Chunk_*.zip"]
          into: .
      after: >
        comma2k19 also needs comma's toolkit, at its pinned commit: paddock setup --repo comma2k19
