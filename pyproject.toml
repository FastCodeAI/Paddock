[project]
name = "paddock"
version = "0.1.0"
description = "Evaluation framework for driving world models across open- and closed-loop benchmarks"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"

# Deliberately thin. Paddock orchestrates other environments; it does not share
# them. Model dependencies (torch, tinygrad, onnxruntime, ...) belong to each
# model's own env, declared in its model.yaml and built by its setup.sh.
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    # Benchmark harnesses decode camera frames to build Observations, so image
    # handling is paddock's own job, not a model dependency.
    "pillow>=10.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Needed only to serve a model as an HTTP policy node (closed-loop benchmarks).
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
# Needed only by `paddock render`. Kept out of the base install so a machine
# that only runs evaluations does not pull a plotting stack.
viz = [
    "matplotlib>=3.8",
    # comma2k19's overlay draws onto frames with PIL. matplotlib already pulls
    # Pillow in, but depending on a transitive dependency is how a working
    # install breaks on someone else's resolver. 10.1 is where
    # `ImageFont.load_default` learned to take a size, which is what keeps the
    # HUD off any one machine's font tree.
    "pillow>=10.1",
]
# comma2k19 ships one raw HEVC elementary stream per segment and no per-frame
# images, so that benchmark -- alone among the current set -- needs a video
# decoder in paddock's own environment rather than in a model's. PyAV is the
# in-process option; the harness also accepts an external ffmpeg via
# PADDOCK_FFMPEG, which is why this is an extra and not a base dependency.
comma2k19 = [
    "av>=12.0",
]
# Needed only by the analysis notebooks under tools/ (tag, cluster and dissect
# recorded predictions). Not in `make setup`: nothing in src/ or tests/ imports
# these, so the pre-PR gate stays as lean as before. Install it beside a setup
# with `uv pip install --python .venv/bin/python -e ".[analysis]"`. nbclient is
# what makes `jupyter execute` work, so a notebook can be run headless on all
# samples; viz brings matplotlib and Pillow, which every analysis lib draws with.
analysis = [
    "paddock[viz]",
    "pandas>=2.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbclient>=0.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # Advisory only. `make typecheck` runs it, `make check` does not, and its CI
    # job cannot fail the build. See the [tool.mypy] block below for why.
    "mypy>=1.10",
]

[project.scripts]
paddock = "paddock.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paddock"]

[tool.ruff]
line-length = 110
target-version = "py311"

# Migration backlog (M2). Code rescued verbatim from untracked working
# directories, still carrying the style of where it was written. Excluded while
# it is adapted, for the same reason as the portability exemption in
# tests/test_portability.py: rewriting 9k lines before committing any of it left
# it sitting unversioned on a scratch disk.
#
# Delete each entry as that directory is adapted. Do not add to this list --
# new code is linted from the start.

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Rescued one-off diagnostics. De-hardcoded, so they pass the portability gate;
# their original style is left alone because rewriting analysis scripts nobody
# is reading risks changing what they measure for no gain.
"tools/**" = [
    "E501", "E702", "E731", "E741", "E402",
    "F401", "F841", "F541",
    "B905", "B019", "B007",
    "UP006", "UP035",
]
# Rescued open-loop adapters still awaiting conversion, in directories whose
# policy.py is already done. Narrower than excluding the whole directory, so new
# code beside them stays linted. Remove the entry when the file is adapted.
#
# B019: @cache on a method pins the instance for the life of the process. Real,
# but this is rescued code -- fix it during conversion, not in a lint pass.
"src/paddock/adapters/models/drivejepa/kitscenes_adapter.py" = ["B019", "E501", "UP006", "UP035"]
"src/paddock/adapters/models/openpilot/camera_adapt.py" = ["E501", "UP006", "UP035"]
"src/paddock/adapters/models/alpamayo15/kitscenes_alpamayo_loader.py" = ["B019", "E501", "UP006", "UP035"]

# Rescued reporting and inference scripts. De-hardcoded, so they pass the
# portability gate; still in their original house style. Cosmetic only.
"src/paddock/adapters/benchmarks/kitscenes/report_alpamayo.py" = ["E501", "E702", "E731", "E741"]
"src/paddock/adapters/benchmarks/kitscenes/report_openpilot.py" = ["E501", "E702", "E731", "E741"]
"src/paddock/adapters/benchmarks/kitscenes/run_openpilot.py" = ["E501", "E702", "E741"]
"src/paddock/adapters/benchmarks/navsim/run_inference.py" = ["E501", "E702", "E741"]
"src/paddock/adapters/benchmarks/navsim/run_kitscenes_inference.py" = ["E501", "E702", "E741"]

# renderer.py must extend sys.path to the neurad-studio checkout before importing
# from it, so its imports genuinely cannot come first.
"src/paddock/adapters/benchmarks/neuroncap/renderer.py" = ["E402"]

[tool.mypy]
# Advisory, and deliberately NOT part of `make check`.
#
# The rule this repo follows is that local and CI must agree on what can
# *reject* your work: CI's blocking gate is literally `make check`, so anything
# added there has to hold at both sites on day one. mypy does not: there are 63
# errors across 19 files today, most of them in the code rescued in M2, which is
# unannotated by construction. A blocking gate would turn every PR red --
# including PRs touching none of those files -- and teach everyone to ignore it.
#
# So it runs, and it reports, and it blocks nothing: `make typecheck` locally,
# an advisory job in CI, and any editor hook you point at it. Every caller
# reads this block, so they cannot drift apart on strictness.
#
# Tighten as the migration backlog in [tool.ruff.lint.per-file-ignores] shrinks,
# not before. Making it blocking is a separate decision that needs those 63
# fixed first.
python_version = "3.11"
# Paddock never imports a model, so torch, tinygrad, mmcv and openpilot are
# absent from this environment by design -- the same fact norecursedirs encodes.
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
# So no caller has to set PYTHONPATH to agree with the others.
mypy_path = "src"
# Without this, a single-file check (`make typecheck PATHS=...`, or an editor
# hook) reports every pre-existing error in everything that file imports.
follow_imports = "silent"

[tool.pytest.ini_options]
testpaths = ["tests", "src/paddock/adapters"]
pythonpath = ["src"]
# Rescued modules import torch, openpilot, mmcv -- none of which exist in
# paddock's own environment, by design. Collection must not try.
norecursedirs = ["tools", "*/scenarios_10hz"]
