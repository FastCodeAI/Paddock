<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Paddock">
  <title>Paddock</title>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#1f2937"/>
  <!-- the paddock from above: a fenced enclosure with its gate open at the bottom-left -->
  <path d="M120 400 L120 138 Q120 112 146 112 L366 112 Q392 112 392 138 L392 374 Q392 400 366 400 L232 400"
        stroke="#5fbaca" stroke-width="26" stroke-linecap="round" fill="none"/>
