  <path d="M72 452 Q 230 470 330 250"
        stroke="#e8933f" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55"/>
  <g fill="#e8933f">
    <circle cx="72" cy="452" r="17"/>
    <circle cx="123" cy="451" r="17"/>
    <circle cx="171" cy="438" r="17"/>
    <circle cx="216" cy="410" r="17"/>
    <circle cx="257" cy="370" r="17"/>
    <circle cx="295" cy="317" r="17"/>
  </g>
  <circle cx="330" cy="250" r="26" fill="#ffffff"/>
</svg>
