[cells.alpamayo2edge]
# A model built for 0.1 s frames, on OpenScene's 2 Hz: it has not been run on nuPlan's
# 10 Hz frames. The README says to compare it with Alpamayo 1.5's 2 Hz pair.
navsim = { run = "navsim/alpamayo2edge/20261111T052918-f9f90a", note = "2 Hz" }
navsim_v1 = { run = "navsim_v1/alpamayo2edge/20261111T070439-f19e8f", note = "2 Hz" }
# Given the route as text, as Alpamayo 1.5's cell is.
kitscenes = { run = "kitscenes/alpamayo2edge/20261111T230906-22b8a7" }
# nuScenes' 2 Hz keyframes, as every row gets; nuScenes is not in its claimed training data.
nuscenes = { run = "nuscenes/alpamayo2edge/20261111T231928-e4e2d6", note = "2 Hz" }
neuroncap = { run = "neuroncap/alpamayo2edge/20261111T231934-33adca" }
# One recorded camera in 2 of its 6 slots, the other 4 black (ALPAMAYO2_EDGE_ABSENT_CAMERAS).
comma2k19 = { run = "comma2k19/alpamayo2edge/20261112T012152-9b1e09" }
bench2drive220 = { run = "bench2drive/alpamayo2edge/full220-836dda734659a86c-56db50", note = "10 Hz" }

# Momentum-aware: each plan may be handed the node's own plan from 0.5 s earlier, as model.yaml declares.
# Open loop resets the node every sample, so the open-loop cells are streamed runs (docs/models/drivejepa.md):
# NAVSIM per log, nuScenes per scene, KITScenes and comma2k19 after a 0.5 s warm-up, a Paddock choice.
[cells.drivejepa]
nuscenes = { run = "nuscenes/drivejepa/20261111T061849-382fec", note = "streamed" }
kitscenes = { run = "kitscenes/drivejepa/20261111T054224-9f8371", note = "0.5 s warm-up" }
comma2k19 = { run = "comma2k19/drivejepa/20261111T074533-0f26ee", note = "0.5 s warm-up" }  # three of its four views black; it reads only the front
navsim = { run = "navsim/drivejepa/20261111T052813-8f96dd", marks = "A", note = "streamed" }
navhard = { run = "navhard/drivejepa/20261110T165434-167fd4", marks = "A", note = "streamed" }
navsim_v1 = { run = "navsim_v1/drivejepa/20261111T090508-ad88e6", marks = "A", note = "streamed" }
bench2drive = { run = "bench2drive/drivejepa/native50-2hz-40c29d24c37d542a-447e23", note = "2 Hz" }
neuroncap = { run = "neuroncap/drivejepa/20261110T204020-036fb3" }
alpasim = { run = "alpasim/drivejepa/legacy-drivejepa_014_20hz_30scenes" }

