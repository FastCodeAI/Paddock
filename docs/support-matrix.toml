# nuScenes-trained checkpoints, zero-shot everywhere else. On NAVSIM the 3 s plan is held to the 4 s NAVSIM
# scores (UNIAD_HORIZON_S / VAD_HORIZON_S), a setting model.yaml lists as ranked with a note. The NAVSIM records
# were written again from their stored chunks (--resume, nothing scored again) after the runner stopped counting a
# byte-identical checkpoint path as an override; the NAVSIM v1 cells replay those runs' plans (no model process).
# Their nuScenes runs are not in results/ yet.
[cells.uniad]
nuscenes = { run = "nuscenes/uniad/20261109T183938-41eed0", marks = "A", note = "scene order" }
