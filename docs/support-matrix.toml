navsim_v1 = { run = "navsim_v1/openpilot/20260914T181009-dbcef4", note = "10 Hz" }
bench2drive = { run = "bench2drive/openpilot/pooled50-40c29d24c37d542a-c7d2b2", marks = "P" }  # routes can end early; it ranks
bench2drive220 = { run = "bench2drive/openpilot/full220-836dda734659a86c-2803bd", marks = "P" }
