# The README's support matrix: one line per cell, naming the run its number comes from.
#
# To add a result: `paddock run ...`, point its cell below at the new run, then run
# `python -m tools.readme_figures` and commit docs/assets/support-matrix.svg with this file.
# tests/test_readme_figures.py fails if a named run is missing, if a ranked cell's run is
# stored valid: false, or if the picture was not redrawn.
#
# A cell is one of
#   { run = "<bench>/<model>/<run id>" }    the number is read from results/<run>/metrics.json
#   { value = 30.09, source = "docs/..." }  typed, for a figure with no stored run; the
#                                           source page must show the same number
#   "not run"                               a variant nobody ran here; a cell left out reads "—"
# with, optionally, `marks` (A, P and S are in the README; R or V leaves a cell unranked)
# and `note` (shown under the number).
# A run must be the row's own model's; a cell that borrows another's names it with `model`.

[[benchmark]]
key = "nuscenes"
name = "nuScenes"
loop = "open"
header = "cumulative L2 avg ↓ (m)"
metric = "l2_uniad_avg"  # not the primary l2_avg: cumulative L2, the ST-P3/VAD convention (`uniad` in the key is historical)
decimals = 3

[[benchmark]]
key = "kitscenes"
name = "KITScenes"
loop = "open"
header = "ADE ↓ (m)"
decimals = 3

[[benchmark]]
key = "comma2k19"
name = "comma2k19"
loop = "open"
header = "ADE@3s ↓ (m)"
decimals = 3

[[benchmark]]
key = "navsim_v1"
name = "NAVSIM v1"
loop = "open"
header = "PDMS ↑ (0–1)"
decimals = 3

[[benchmark]]
key = "navsim"
name = "NAVSIM v2"
loop = "open"
header = "EPDMS ↑ (0–1), navtest, stage one"
decimals = 3

[[benchmark]]
key = "navhard"
name = "NAVSIM v2 hard"
loop = "open"
header = "EPDMS ↑ (0–1), navhard, two stages"
decimals = 3

[[benchmark]]
key = "bench2drive"
name = "Bench2Drive"
loop = "closed"
header = "driving score ↑ (0–100), 50 of 220 routes"
decimals = 2

# Every model the same way over all 220 routes but the ones set aside for every model (issue #158;
# "The 220-route protocol" in docs/benchmarks/bench2drive.md). It fills as models are run.
[[benchmark]]
key = "bench2drive220"
benchmark = "bench2drive"
name = "Bench2Drive"  # shared with the 50-route column, drawn once across both
loop = "closed"
header = "driving score ↑ (0–100), 216 of 220 routes"
decimals = 2

[[benchmark]]
key = "neuroncap"
name = "neuroNCAP"
loop = "closed"
header = "score ↑ (0–5)"
decimals = 2

[[benchmark]]
key = "alpasim"
name = "AlpaSim"
loop = "closed"
header = "nuRec scene score ↑ (0–1), 30 of 913 scenes"
decimals = 4

[[model]]
key = "openpilot"
name = "OpenPilot"

[[model]]
key = "alpamayo15"
name = "Alpamayo 1.5"

[[model]]
key = "alpamayo2edge"
name = "Alpamayo 2 Edge"

[[model]]
key = "drivejepa"
name = "Drive-JEPA"

[[model]]
key = "visionpilot"
name = "VisionPilot"
marks = "P"  # every cell in the row; S is on each cell but comma2k19, the one re-run since the CURV_SCALE fix

[[model]]
key = "meteor"
name = "METEOR"

[[model]]
key = "qwendrive"
name = "Qwen-Drive 1.0"

[[model]]
key = "autoe2e"
name = "AutoE2E"

[[model]]
key = "uniad"
name = "UniAD"

[[model]]
key = "vad"
name = "VAD"

[[model]]
key = "constant_velocity"
name = "Baseline (Constant Velocity)"
floor = true

[cells.openpilot]
nuscenes = { run = "nuscenes/openpilot/20260908T110028-b71f4f" }
kitscenes = { run = "kitscenes/openpilot/20261008T004723-a369d1", marks = "A" }
