neuroncap = { run = "neuroncap/uniad/20261109T092826-5919f1", marks = "A" }  # its scenes are nuScenes val scenes
alpasim = { run = "alpasim/uniad/20261110T120651-8ea842" }  # six cameras, re-rendered as nuScenes' rig

[cells.vad]
nuscenes = { run = "nuscenes/vad/20261110T000020-53cda0", marks = "A", note = "scene order" }
