# The README's support matrix: one line per cell, naming the run its number comes from.
#
# To add a result: `paddock run ...`, point its cell below at the new run, then run
# `python -m tools.readme_figures` and commit docs/assets/support-matrix.svg with this file.
# tests/test_readme_figures.py fails if a named run is missing, if a ranked cell's run is
# stored valid: false, or if the picture was not redrawn.
#
# A cell is one of
#   { run = "<bench>/<model>/<run id>" }    the number is read from results/<run>/metrics.json
#   { value = 30.09, source = "docs/..." }  typed, for a figure with no stored run; the
#                                           source page must show the same number
#   "not run"                               a variant nobody ran here; a cell left out reads "—"
# with, optionally, `marks` (A, P and S are in the README; R or V leaves a cell unranked)
# and `note` (shown under the number).
# A run must be the row's own model's; a cell that borrows another's names it with `model`.

[[benchmark]]
key = "nuscenes"
name = "nuScenes"
loop = "open"
header = "cumulative L2 avg ↓ (m)"
metric = "l2_uniad_avg"  # not the primary l2_avg: the column is the UniAD-style cumulative L2
decimals = 3

[[benchmark]]
key = "kitscenes"
name = "KITScenes"
loop = "open"
header = "ADE ↓ (m)"
decimals = 3

[[benchmark]]
key = "comma2k19"
name = "comma2k19"
loop = "open"
header = "ADE@3s ↓ (m)"
decimals = 3

[[benchmark]]
key = "navsim_v1"
name = "NAVSIM v1"
loop = "open"
header = "PDMS ↑ (0–1)"
decimals = 3

[[benchmark]]
key = "navsim"
name = "NAVSIM v2"
loop = "open"
header = "EPDMS ↑ (0–1), navtest, stage one"
decimals = 3

# All 220 routes of bench2drive220.xml for every model (issue #158; "Bench2Drive — 220 routes" in
# docs/benchmarks/bench2drive.md). The 50-route column it replaces covered 14 of the 44 scenario types.
[[benchmark]]
key = "bench2drive"
name = "Bench2Drive"
loop = "closed"
header = "driving score ↑ (0–100), all 220 routes"
decimals = 2

[[benchmark]]
key = "neuroncap"
name = "neuroNCAP"
loop = "closed"
header = "score ↑ (0–5)"
decimals = 2

[[benchmark]]
key = "alpasim"
name = "AlpaSim"
loop = "closed"
header = "nuRec scene score ↑ (0–1), 30 of 913 scenes"
decimals = 4

[[model]]
key = "openpilot"
name = "OpenPilot"

[[model]]
key = "alpamayo15"
name = "Alpamayo 1.5"

[[model]]
key = "alpamayo2edge"
name = "Alpamayo 2 Edge"

[[model]]
key = "drivejepa"
name = "Drive-JEPA"

[[model]]
key = "visionpilot"
name = "VisionPilot"
marks = "P"  # every cell in the row; S only where a cell predates the CURV_SCALE fix

[[model]]
key = "meteor"
name = "METEOR"

[[model]]
key = "qwendrive"
name = "Qwen-Drive 1.0"

[[model]]
key = "autoe2e"
name = "AutoE2E"

[[model]]
key = "constant_velocity"
name = "Baseline (Constant Velocity)"
floor = true

[cells.openpilot]
nuscenes = { run = "nuscenes/openpilot/20260908T110028-b71f4f" }
kitscenes = { run = "kitscenes/openpilot/20261008T004723-a369d1", marks = "A" }
comma2k19 = { run = "comma2k19/openpilot/20261106T003719-5cde54" }
navsim = { run = "navsim/openpilot/20260911T161513-3a4c90", note = "10 Hz" }
navsim_v1 = { run = "navsim_v1/openpilot/20260914T181009-dbcef4", note = "10 Hz" }
bench2drive = { run = "bench2drive/openpilot/full220-86aa45e768a29a64-102db6", marks = "P" }  # routes can end early; it ranks
neuroncap = { run = "neuroncap/openpilot/20260905T055713-11ac59" }
alpasim = { run = "alpasim/openpilot/legacy-openpilot_020_30scenes" }

[cells.alpamayo15]
