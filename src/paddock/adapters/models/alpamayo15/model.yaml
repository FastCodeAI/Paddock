name: alpamayo15
description: NVIDIA Alpamayo 1.5 VQA-10B - chain-of-causation VLM plus a diffusion trajectory expert
repo: alpamayo1.5

runtime:
  kind: uv
  python: "3.12"
  venv: "{repo}/a1_5_venv"
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  # Ablation/debugging knobs policy.py reads from the environment (_env_or /
  # _env_float / os.environ.get) -- without this, `ALPAMAYO_NAV=0 paddock run
  # ...` sets the var in paddock's own process, not the model's subprocess
  # (runtime/env.py builds that from a strict allowlist), and the ablation
  # silently runs as if the flag were never set.
  env_passthrough:
    - ALPAMAYO_NAV
    - ALPAMAYO_NUM_TRAJ_SAMPLES
    - ALPAMAYO_TEMPERATURE
    - ALPAMAYO_TOP_P
    - ALPAMAYO_MAX_GEN
    - ALPAMAYO_RESERVE_GB
    - ALPAMAYO_FRAME_SELECT
    - ALPAMAYO_SAVE_REASONING
  env:
    ALPAMAYO_CHECKPOINT: "{weights}/Alpamayo-1.5-10B"
    ALPAMAYO_COSMOS: "{weights}/Cosmos-Reason2-8B"
    PADDOCK_WEIGHTS: "{weights}"
    # Claimed before the checkpoint read, which takes ~12 min on a contended card.
    ALPAMAYO_RESERVE_GB: "26"
    # The route instruction is on; "0" runs the no-nav baseline (policy.py). The
    # code already defaults to 1. Declared so a site that restates it is not
    # read as overriding it.
    ALPAMAYO_NAV: "1"
    # KITScenes addressing: this repo's code wants the directory *containing*
    # data/, where openpilot's wants data/ itself. One registry entry, projected.
    KITSCENES_ROOT: "{data.kitscenes.parent}"
    KITSCENES_REPO: "{repos}/kitscenes"
    KITSCENES_SAMPLE_LIST: "{data.navsim.exp}/inference/kitscenes_e2e_final.pkl"
  # Site overrides of these change speed, memory or what is logged, not the
  # plan, so they leave a run valid; any other [models.alpamayo15.env] key makes
  # it valid: false. ALPAMAYO_SAVE_REASONING only adds the reasoning text to
  # each sample's extras.
  tuning_env: [ALPAMAYO_RESERVE_GB, ALPAMAYO_SAVE_REASONING]

capabilities:
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT]
  vram_gb: 26
  # A 21 GB checkpoint read on a shared box genuinely takes this long. A shorter
  # timeout looks like a hang and kills a run that was about to work.
  startup_timeout_s: 3600
  waypoint_dt: 0.5
  # No floor. The pose branch interpolates to any cadence, and `_image_frames`
  # falls back to the most recent distinct frames when its 0.1 s grid would
  # return duplicates -- which is what a sub-10 Hz source causes. Measured on
  # NAVSIM's 2 Hz data, that fallback is worth +0.207 EPDMS, almost all of it
  # collisions avoided.
  min_input_hz: 0.0
  # What it was built for: four camera frames 0.1 s apart and 16 poses at 0.1 s
  # (load_physical_aiavdataset.py in the vendor repo). A benchmark holding
  # 10 Hz data should feed that rather than the 0.5 s fallback above.
  native_input_hz: 10.0
  # How often it plans: once per frame of that 0.1 s grid, so a closed-loop benchmark that
  # steps faster (Bench2Drive's 20 Hz) asks once every 0.1 s and follows the last plan in
  # between. Without it Bench2Drive asked every tick, and its 10 Hz cell needed the host's
  # PADDOCK_INFER_HZ, which a run no longer ranks with. HUGSIM steps at 4 Hz, so it still
  # asks every step; neither AlpaSim nor neuroNCAP reads it.
  planning_hz: 10.0
  history_s: 1.5

  # -- model card (docs/models/comparison.md) --
  architecture: "Cosmos-Reason2 VLM + diffusion trajectory decoder"
  params_m: 10000
  size_gb: 20
  precision: bf16
  input_size: [448, 280]
  # Four slots: three wide views, and a 30 deg telephoto that policy.py crops out
  # of CAM_FRONT (CAMERA_SLOTS). cameras above is what a simulator renders. On
  # AlpaSim the bridge also sends the rendered telephoto as CAM_FRONT_TELE, and
  # policy.py uses it in place of the crop; that is why the policy decodes four
  # cameras while every source has to send only these three.
  camera_views: [CAM_FRONT_LEFT, CAM_FRONT, CAM_FRONT_RIGHT, CAM_FRONT_TELE]
  history_frames: 4
  # Four frames and 16 ego poses, both 0.1 s apart (NUM_CAM_FRAMES, NUM_HISTORY_STEPS).
  camera_hz: 10.0
  ego_history_steps: 16
  ego_history_hz: 10.0
  output_kind: waypoints
  horizon_s: 6.4
  # 64 waypoints at 10 Hz; policy.py resamples them to waypoint_dt, except when
  # the body asks for a plan_dt (AlpaSim's bridge): then all 64 go back, 0.1 s apart.
  plan_points_hz: 10.0
  # Samples unseeded at T=1.0/top_p=0.95 in closed loop. One run is a draw, not
  # a measurement: sd 1.817 across seeds on frontal-0103.
  stochastic: true
  trained_on:
    # Not zero-shot everywhere: the model card (nvidia/Alpamayo-1.5-10B, "Training
    # Dataset") lists 17 public driving datasets beside NVIDIA's own data.
    # 1. The VLM base: Cosmos-Reason2-8B (config.json vlm_name_or_path), itself
    #    post-trained from Qwen3-VL-8B-Instruct on its own physical-AI corpora.
    - dataset: qwen3-vl
    - dataset: cosmos-reason2
    # 2. NVIDIA's fleet: 80,000 h of multi-camera driving, US and EU, and 3M
    #    chain-of-causation reasoning traces (about 10 % human, the rest VLM-made).
    #    The public PhysicalAI-AV clips are partitioned to match its train/test
    #    split; none of paddock's 30 AlpaSim scenes is a train clip (7 alpasim,
    #    2 test, 21 not in the public dataset), checked in alpamayo_aligned.parquet.
    - dataset: nvidia-internal
    # 3. The card's public sets. Two are NAVSIM data (NAVSIM-ReCogDrive, NAVSIM-Traj)
    #    and five are built on nuScenes (nuScenesQA, DriveLM, nuInstruct, OmniDrive,
    #    Talk2Car); no split is given for any. See comparison.md, Alpamayo 1.5 x
    #    navsim and x nuscenes. The other ten: CODA-LM, Drive-Action, DriveGPT4,
    #    LingoQA, MapLM, MM-AU, Roadwork, Senna, SUTD, W3DA.
    - dataset: navsim
    - dataset: nuscenes
    - dataset: public-driving-qa
# One key, not one per benchmark that arrived: two `benchmarks:` lines make YAML
# keep the last and silently drop the rest, which is how alpasim once went missing.
benchmarks: [kitscenes, neuroncap, navsim, navsim_v1, bench2drive, alpasim, nuscenes, comma2k19, nuplan]
