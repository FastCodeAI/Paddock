name: alpamayo15_overfit
description: alpamayo15 with its diffusion head overfit to cached rollouts from two scenes (0053, 0058) -- a wiring smoke test, not a claim about generalization (see rl_training/sft_train_diffusion_head.py)
repo: alpamayo1.5

runtime:
  kind: uv
  python: "3.12"
  venv: "{repo}/a1_5_venv"
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  env_passthrough:
    - ALPAMAYO_NAV
    - ALPAMAYO_NUM_TRAJ_SAMPLES
    - ALPAMAYO_TEMPERATURE
    - ALPAMAYO_TOP_P
    - ALPAMAYO_MAX_GEN
    - ALPAMAYO_RESERVE_GB
    - ALPAMAYO_FRAME_SELECT
    - ALPAMAYO_SAVE_REASONING
    # The overlay checkpoint sft_train_diffusion_head.py's --save-overlay
    # wrote -- see adapters/models/alpamayo15_overfit/policy.py. Required;
    # policy.load() raises if unset rather than silently falling back to the
    # plain alpamayo15 weights, which would score this model as alpamayo15
    # without anyone noticing.
    - ALPAMAYO_OVERLAY_CHECKPOINT
  env:
    ALPAMAYO_CHECKPOINT: "{weights}/Alpamayo-1.5-10B"
    ALPAMAYO_COSMOS: "{weights}/Cosmos-Reason2-8B"
    PADDOCK_WEIGHTS: "{weights}"
    ALPAMAYO_RESERVE_GB: "26"

capabilities:
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT]
  vram_gb: 26
  startup_timeout_s: 3600
  waypoint_dt: 0.5
  min_input_hz: 0.0
  native_input_hz: 10.0
  history_s: 1.5

  architecture: "Cosmos-Reason2 VLM + diffusion trajectory decoder, diffusion head overfit to scenes 0053+0058"
  params_m: 10000
  size_gb: 20
  precision: bf16
  input_size: [448, 280]
  history_frames: 4
  output_kind: waypoints
  horizon_s: 6.4
  stochastic: true
  trained_on:
    - dataset: nvidia-internal
    - dataset: 2scene-overfit-smoke-test

# Deliberately empty, not [neuroncap]: this is a wiring smoke test, not a
# scored model (see docs/models/alpamayo15_overfit.md's "Status"). An empty
# list only keeps it out of `--model all` sweeps (runner.py filters `all` by
# `bench in m.benchmarks`); a direct `--model alpamayo15_overfit --bench
# neuroncap` invocation does not consult this list and still works, which is
# the documented way to run it.
benchmarks: []
