# @package _global_
# The driver AlpaSim composes when paddock serves Alpamayo 2 Edge through the bridge.
#
# AlpaSim ships no Edge driver of its own, so there is no native row to reproduce.
# This file is the shared 20 Hz referee every Alpamayo row on AlpaSim is scored
# under (paddock_bridge_alpamayo15.yaml, value for value: control step, warm-up,
# steps, shutter, bonnet mask), with the cameras changed to the six Edge reads:
#
#   * cross left, front wide and cross right (120 deg), rear left and rear right
#     (70 deg) and the front telephoto (30 deg) -- Edge's camera IDs 0, 1, 2, 3, 5
#     and 6. AlpaSim's scenes are recordings of that same rig, so each slot gets
#     the camera it was trained on, through its own f-theta lens: no extra_cameras
#     block, nothing re-rendered as a pinhole, and the telephoto is the real one
#     rather than a crop of the front camera as on every other benchmark. The
#     rear telephoto (ID 4) is not an Edge input and is not rendered;
#   * 1920 x 1080 asked for: the PhysicalAI-AV frame size Edge's own loader
#     decodes, which the vendor then resizes to each slot's pixel budget;
#   * 20 Hz for both the control step and every camera, 30 ms shutter. Every
#     control step then carries a fresh frame of every camera, so the frames the
#     node keeps are the ones its slots ask for (-2, -1, -0.5, -0.1, 0 s front and
#     telephoto; -1, -0.1, 0 s the rest) at their real times;
#   * 3.0 s of ground-truth warm-up with the driver called throughout, so Edge's
#     2.0 s of frames and 1.9 s of poses are full at handover, and 400 steps,
#     which covers the whole ~19.8 s clip at 50 ms.
#
# Six cameras at 20 Hz is half again alpamayo15's four; rendering dominates the
# wall clock. Kept separate from alpamayo15's file so a change made for one model
# cannot move the other.

wizard:
  # driver is absent on purpose: the bridge is already listening.
  run_sim_services:
    ["renderer", "physics", "trafficsim", "controller", "runtime"]

  external_services:
    # Overridden per episode with the port the harness actually reserved; this
    # value only has to compose.
    driver:
      - "localhost:9200"

  debug_flags:
    # Containers join the host network, so localhost:<port> reaches the bridge.
    use_localhost: true

# Do NOT set `runtime.endpoints.driver.skip: true`. Combined with
# external_services it makes the runtime skip the driver entirely, and the run
# still exits 0 with a full metrics table that is not the model's.
runtime:
  simulation_config:
    force_gt_duration_us: 3_000_000
    # The driver is called during warm-up; the bridge sends those frames to
    # /observe, so the node's history is full at handover.
    skip_driver_during_force_gt: false
    control_timestep_us: 50_000
    n_sim_steps: 400
    n_rollouts: 1
    planner_delay_us: 0
    ego_mask_rig_config_id: hyperion_8_1
    cameras:
      - {logical_id: camera_cross_left_120fov,  height: 1080, width: 1920, frame_interval_us: 50_000, shutter_duration_us: 30_000}
      - {logical_id: camera_front_wide_120fov,  height: 1080, width: 1920, frame_interval_us: 50_000, shutter_duration_us: 30_000}
      - {logical_id: camera_cross_right_120fov, height: 1080, width: 1920, frame_interval_us: 50_000, shutter_duration_us: 30_000}
      - {logical_id: camera_rear_left_70fov,    height: 1080, width: 1920, frame_interval_us: 50_000, shutter_duration_us: 30_000}
      - {logical_id: camera_rear_right_70fov,   height: 1080, width: 1920, frame_interval_us: 50_000, shutter_duration_us: 30_000}
      - {logical_id: camera_front_tele_30fov,   height: 1080, width: 1920, frame_interval_us: 50_000, shutter_duration_us: 30_000}
