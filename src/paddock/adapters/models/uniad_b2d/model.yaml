name: uniad_b2d
description: UniAD-Base trained on Bench2Drive (Thinklab-SJTU Bench2DriveZoo) - the same stack, CARLA-trained, six CARLA commands
repo: Bench2DriveZoo

runtime:
  # The env uniad builds and shares (setup.sh beside uniad's model.yaml), plus Bench2DriveZoo's own `mmcv`
  # package built in place in the checkout (setup.sh here).
  kind: conda
  python: "3.9"
  venv: "{repos}/.conda-envs/uniad-vad"
  # First on the path so the vendored `mmcv` (mmcv + mmdet + mmdet3d 0.17.1) shadows the env's mmcv-full;
  # policy.py refuses to load if it does not.
  pythonpath: ["{repo}"]
  # Load-bearing: the config names its motion anchors relative to the checkout
  # (data/others/b2d_motion_anchor_infos_mode6.pkl, tracked in the repo).
  cwd: "{repo}"
  env:
    # The README's table links UniAD-Base to tiny_e2e_b2d.py and UniAD-Tiny to base_e2e_b2d.py; the base
    # checkpoint loads strictly into base_e2e_b2d.py only.
    UNIAD_B2D_CONFIG: "{repo}/adzoo/uniad/configs/stage2_e2e/base_e2e_b2d.py"
    # huggingface.co/rethinklab/Bench2DriveZoo, uniad_base_b2d.pth
    UNIAD_B2D_CHECKPOINT: "{weights}/bench2drivezoo/uniad_base_b2d.pth"
    # UNIAD_B2D_HORIZON_S (unset): continue the plan past its own 3 s by holding the last 0.5 s step, for
    # NAVSIM, which scores 4 s and refuses a shorter plan. An extrapolation the model never made, so it is
    # set per benchmark, in a [models.uniad_b2d.benchmarks.navsim.env] pairing, and the report notes it.
    # UNIAD_B2D_HORIZON_S: "4.0"
    PYTHONNOUSERSITE: "1"
    MPLBACKEND: "Agg"
    OMP_NUM_THREADS: "2"
    # Frame-preparing threads beside the model's own, as uniad's model.yaml explains. Speed only.
    UNIAD_VAD_THREADS: "5"
  tuning_env: [UNIAD_VAD_THREADS]

capabilities:
  # Bench2DriveZoo's order (prepare_B2D.py CAMERAS, and its agents').
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]
  # Measured 4.1 GB for the process (2.4 GB allocated, 3.3 GB reserved peak).
  vram_gb: 6
  startup_timeout_s: 900
  waypoint_dt: 0.5
  # The rate it trained at: Bench2Drive's 10 Hz logs sampled every 5th frame (sample_interval=5), so its
  # temporal BEV fuses a grid 0.5 s old. Bench2DriveZoo's own agent asks it every 20 Hz tick, and its
  # published 45.81 DS was driven that way (docs/models/uniad_b2d.md).
  planning_hz: 2.0

  # -- model card (docs/models/comparison.md) --
  architecture: "ResNet-101-DCN + BEVFormer (200x200) with track, map, motion, occupancy and planning heads"
  params_m: 131.8
  size_gb: 1.0
  precision: fp32
  input_size: [1600, 900]
  history_frames: 1
  camera_hz: 2.0
  output_kind: waypoints
  horizon_s: 3.0
  plan_points_hz: 2.0
  stochastic: false
  needs_speed: true
  trained_on:
    # Bench2Drive base (1,000 clips), less the validation clips of
    # data/splits/bench2drive_base_train_val_split.json (docs/DATA_PREP.md at the pinned sha). Not a
    # datasets.yaml key: paddock has no Bench2Drive training data. Some base clips are the same scenario at
    # the same place as an evaluation route (docs/models/comparison.md). How the backbone was
    # initialised is not in the checkout: the stage-1 and stage-2 configs set no load_from, and only
    # Bench2DriveZoo's BEVFormer config names one (FCOS3D's nuScenes-trained r101_dcn_fcos3d_pretrain.pth).
    - dataset: bench2drive
      split: base train
# UNIAD_B2D_HORIZON_S changes what a NAVSIM score means. tests/test_report.py accepts a score note only once a
# stored run sets its key, so these two lines go in with the first stored NAVSIM run; until then such a
# run is stored valid: false:
#   score_notes:
#     UNIAD_B2D_HORIZON_S: "plan continued to {value} s by paddock; the model itself plans 3 s"
#   ranked_with_note: [UNIAD_B2D_HORIZON_S]

# Where it runs (docs/models/uniad_b2d.md, "Benchmarks"): every benchmark that sends the six surround cameras.
# navsim and navsim_v1 need UNIAD_B2D_HORIZON_S = "4.0" (above). neuroncap asks every 0.1 s whatever
# planning_hz says; the policy steps the model every 0.5 s and holds its plan in between
# (bev_planners.held_plan). Not listed: comma2k19 sends one camera; alpasim renders no rectified six-camera
# nuScenes-like rig (no alpasim.yaml).
benchmarks: [hugsim, nuscenes, bench2drive, kitscenes, nuplan, neuroncap, navsim, navsim_v1]
