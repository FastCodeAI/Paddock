name: visionpilot
description: Autoware VisionPilot - AutoSteer/AutoDrive/AutoSpeed ONNX stack with an MPC-style planner
repo: vision_pilot

runtime:
  # The Python side is a reimplementation of the C++ planner driving the three
  # shipped ONNX models, so it needs onnxruntime rather than the built binary.
  kind: conda
  python: "3.10"
  venv: "{repos}/.conda-envs/ncap"
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  env:
    VISIONPILOT_WEIGHTS: "{repo}/VisionPilot/modules/models/weights"
    # CPU by default: the recorded closed-loop runs used it, and the renderer
    # wants the GPU. Set to "cuda" to use CUDAExecutionProvider.
    VISIONPILOT_PROVIDERS: "cpu"
    # Deliberately unset, so this reproduces the recorded baseline runs.
    #
    # The shipped default (2.0) starves the fusion filter's velocity state so it
    # never identifies closing speed; 0.3 converges in ~2.4 s and scores better.
    # But 0.3 was run as a separate ablation (outputs/runs1_noise0.3), not as the
    # baseline, so setting it here would silently compare a tuned VisionPilot
    # against every other model's stock configuration.
    #
    # To run the ablation:  VISIONPILOT_PROCESS_NOISE_DIST=0.3 paddock run ...
    # NOT a performance tweak. conda-forge ships libgomp.so.1 as a symlink to
    # LLVM's libomp.so, and MUMPS -- inside IPOPT, called by the planner every
    # frame -- deadlocks in dmumps_perform_copies() under it.
    OMP_NUM_THREADS: "1"
    # Does NOT bound onnxruntime, which has its own pool defaulting to every
    # core. Leave unset for single-node runs; set VISIONPILOT_ORT_THREADS (e.g.
    # "2") in [models.visionpilot.env] when a benchmark starts several nodes.
    #
    # VISIONPILOT_SETPOINT selects where the ACC cruise set-speed is latched in
    # open-loop, where infer_sequence replays history before the scored frame.
    # Default "scored" latches at the frame being scored. "run_start" latches at
    # the first history frame, which is what runs recorded before that change
    # used -- on KITScenes that is 4.8 s earlier and pins 39 of 223 samples to
    # the 1 m/s floor. Set it in [models.visionpilot.env]: a shell variable does
    # not reach the node, since only runtime.env.PASSTHROUGH is inherited.

capabilities:
  cameras: [CAM_FRONT]
  vram_gb: 0
  startup_timeout_s: 300
  waypoint_dt: 0.5

benchmarks: [kitscenes, neuroncap, navsim, bench2drive]
