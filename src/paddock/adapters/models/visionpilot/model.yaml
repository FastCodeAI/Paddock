name: visionpilot
description: Autoware VisionPilot - AutoSteer/AutoDrive/AutoSpeed ONNX stack with an MPC-style planner
repo: vision_pilot

runtime:
  # The Python side is a reimplementation of the C++ planner driving the three
  # shipped ONNX models, so it needs onnxruntime rather than the built binary.
  kind: conda
  python: "3.10"
  venv: "{repos}/.conda-envs/ncap"
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  env:
    VISIONPILOT_WEIGHTS: "{repo}/VisionPilot/modules/models/weights"
    # CPU by default: the recorded closed-loop runs used it, and the renderer
    # wants the GPU. Set to "cuda" to use CUDAExecutionProvider.
    VISIONPILOT_PROVIDERS: "cpu"
    # Deliberately unset, so this reproduces the recorded baseline runs.
    #
    # The shipped default (2.0) starves the fusion filter's velocity state so it
    # never identifies closing speed; 0.3 converges in ~2.4 s and scores better.
    # But 0.3 was run as a separate ablation (outputs/runs1_noise0.3), not as the
    # baseline, so setting it here would silently compare a tuned VisionPilot
    # against every other model's stock configuration.
    #
    # To run the ablation:  VISIONPILOT_PROCESS_NOISE_DIST=0.3 paddock run ...
    # NOT a performance tweak. conda-forge ships libgomp.so.1 as a symlink to
    # LLVM's libomp.so, and MUMPS -- inside IPOPT, called by the planner every
    # frame -- deadlocks in dmumps_perform_copies() under it.
    OMP_NUM_THREADS: "1"
    # Does NOT bound onnxruntime, which has its own pool defaulting to every
    # core. Leave unset for single-node runs; set VISIONPILOT_ORT_THREADS (e.g.
    # "2") in [models.visionpilot.env] when a benchmark starts several nodes.
    #
    # VISIONPILOT_SETPOINT selects where the ACC cruise set-speed is latched in
    # open-loop, where infer_sequence replays history before the scored frame.
    # Default "scored" latches at the frame being scored. "run_start" latches at
    # the first history frame, which is what runs recorded before that change
    # used -- on KITScenes that is 4.8 s earlier and pins 39 of 223 samples to
    # the 1 m/s floor. Set it in [models.visionpilot.env]: a shell variable does
    # not reach the node, since only runtime.env.PASSTHROUGH is inherited.
  # Site overrides of these change speed or memory, not the plan, so they
  # leave a run valid; any other [models.visionpilot.env] key makes it valid: false.
  tuning_env: [VISIONPILOT_ORT_THREADS, VISIONPILOT_GPU_MEM_MB]

capabilities:
  cameras: [CAM_FRONT]
  vram_gb: 0
  startup_timeout_s: 300
  waypoint_dt: 0.5

  # -- model card (docs/models/comparison.md) --
  architecture: "three YOLO-family conv nets: AutoSteer, AutoSpeed, AutoDrive"
  # 8.22 + 9.33 + 10.58. A later count puts AutoSpeed at 9.31; the total is 28.1
  # either way.
  params_m: 28.1
  size_gb: 0.112
  precision: fp32
  input_size: [1024, 512]
  # AutoDrive consumes a frame pair; the other two are single-frame.
  history_frames: 2
  # The pair was 0.1 s apart in training: auto_drive's loader pairs consecutive
  # front-camera images of a ZOD sequence (load_data_auto_drive.py, "(T-1, T)"), and
  # ZOD records them at 10 Hz (arXiv 2305.02008). policy.py pairs the previous
  # request instead, so a 2 Hz benchmark hands it frames 0.5 s apart. No ego
  # history: it reads the current speed only.
  camera_hz: 10.0
  # It predicts lane curvature and the closest in-path object, not a plan --
  # which is why it has no ADE and why horizon_s is absent rather than zero.
  # AutoSteer's waypoints are in camera coordinates with no time parameterisation.
  output_kind: controls
  trained_on:
    # Lane and CIPO datasets only. Zero-shot on every paddock benchmark.
    - dataset: openlane
    - dataset: tusimple
    - dataset: curvelanes
# One list, appended to. Two `benchmarks:` keys is valid YAML and keeps only the
# last, which is how a model has silently dropped off a board before.
#
# comma2k19 supplies exactly what `infer` reads -- one front camera, its pinhole
# and its `camera2ego` -- and `project_to_ground` intersects the road plane
# analytically, so nothing dataset-specific is needed to feed it. Run it with
# `VISIONPILOT_PROVIDERS=cuda` from the site config: 160 history frames x 3 nets
# x 10,165 samples is not a CPU workload.
benchmarks: [kitscenes, neuroncap, navsim, navsim_v1, bench2drive, nuscenes, comma2k19, nuplan]
