# How the AlpaSim benchmark drives HiP-AD through paddock's bridge.
#
# Read by adapters/benchmarks/alpasim/harness.py (profile_for); docs/adding-a-model.md, "AlpaSim settings".
#
# VAD's profile flag for flag (models/vad/alpasim.yaml, where each flag is explained): HiP-AD reads the
# same six cameras, loaded at 1600 x 900 and asked every 0.5 s. AlpaSim's route rides along stamped with
# its frame's time; HiP-AD takes its target point from it (hipad/inputs.py, target_record).

# Driver config under adapters/benchmarks/alpasim/configs/driver/, shared with uniad and vad.
driver: paddock_bridge_nuscenes_rig

# Extra bridge.py flags.
bridge_args:
  # AlpaSim id=the node's camera name; the tele camera's id carries CAM_BACK.
  - --camera-name
  - camera_front_wide_120fov=CAM_FRONT
  - --camera-name
  - camera_cross_left_120fov=CAM_FRONT_LEFT
  - --camera-name
  - camera_cross_right_120fov=CAM_FRONT_RIGHT
  - --camera-name
  - camera_rear_left_70fov=CAM_BACK_LEFT
  - --camera-name
  - camera_front_tele_30fov=CAM_BACK
  - --camera-name
  - camera_rear_right_70fov=CAM_BACK_RIGHT
  # Each camera's pinhole K from start_session.
  - --pinhole-intrinsics
  # A replan every 0.5 s (planning_hz 2); equals the cameras' frame_interval_us.
  - --replan-every-us
  - "500000"
  # Both must equal paddock_bridge_nuscenes_rig.yaml's control step (not its
  # cameras' 500 ms) and force_gt_duration_us; a test checks they do.
  - --frame-interval-us
  - "50000"
  - --force-gt-us
  - "3000000"
  # The CAN bus as VAD gets it. HiP-AD reads neither speed nor acceleration
  # (policy.py); kept so the two profiles drive AlpaSim alike.
  - --canbus-ego-frame
  - --canbus-acceleration
  # The route, as route_xy, and the time of its frame, as route_timestamp_us:
  # the node takes its target point from the route (hipad/inputs.py, target_record).
  - --send-route
  - --send-route-time
  # Not passed, as for VAD: --observe-between-replans, --pad-ego-history,
  # --waypoint-dt (the default 0.5 s is HiP-AD's plan spacing).

# Under adapters/benchmarks/alpasim/scenes/: each scene pinned to one artifact.
scenes_csv: public_2601_30scenes_26p01.csv

# Write the bridge's per-replan log next to the run's samples.jsonl.
replan_log: true
