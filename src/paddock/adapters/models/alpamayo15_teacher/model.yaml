name: alpamayo15_teacher
description: Privileged ground-truth planner used to generate Alpamayo 1.5's SFT training labels -- exact world state in, no learned components, no image input. Not a scored baseline and not a real driving system.
repo: alpamayo-scripts

runtime:
  kind: conda
  python: "3.10"
  # Same env visionpilot already uses: nuscenes-devkit + numpy/scipy/pyyaml,
  # which is everything rl_training/expert/*.py needs. No setup.sh of its own.
  venv: "{repos}/.conda-envs/ncap"
  # Flat modules (reference_path.py, frenet.py, expert.py, ...) import each
  # other directly (`from reference_path import ...`), not as a package --
  # both directories need to be on the path for that to resolve.
  pythonpath: ["{repo}/rl_training", "{repo}/rl_training/expert"]
  cwd: "{repo}/rl_training/expert"
  env:
    NUSCENES_DATAROOT: "{data.nuscenes}"
    NUSCENES_VERSION: "v1.0-trainval"
  # EXPERT_RECORD_SFT_DIR: SFT dataset collection (spec 4.1) -- set in the
  # launching shell, not here, since it names a per-run output directory,
  # not a fixed value this model always needs. Without this in the
  # allowlist, runtime/env.py's strict per-subprocess allowlist means the
  # var would silently never reach the policy subprocess at all.
  env_passthrough:
    - EXPERT_RECORD_SFT_DIR

capabilities:
  # Never read in infer() -- the expert is privileged (exact world state, not
  # vision) and has no image input at all. Declared anyway, matching
  # constant_velocity's precedent: declaring zero cameras makes the renderer
  # skip work the scored comparison assumes happened, which would make this
  # model's wall-clock profile incomparable to every other model's.
  cameras: [CAM_FRONT]
  vram_gb: 0
  startup_timeout_s: 120
  waypoint_dt: 0.5

  # -- model card (docs/models/comparison.md) --
  architecture: "Hand-written Frenet-frame candidate planner (speed profiles x go-around laterals, scored with hard constraints + anti-freeze soft costs); no learned components"
  output_kind: waypoints
  horizon_s: 6.4
  # Deterministic given (state, targets, previous_choice, stationary_duration_s)
  # -- the anti-freeze hysteresis/stuck-rule terms are the only state that
  # depends on anything beyond the current observation, and the caller
  # supplies that explicitly rather than this policy hiding it.
  stochastic: false
  needs_speed: true
  # Trained on nothing: it labels states for training other models, it is not
  # one. Explicit empty list per the template's convention, not absent --
  # "trained on nothing" is itself the claim.
  trained_on: []

# Open-loop benchmarks have no actor ground-truth channel for this adapter to
# read (Observation.actors/scene_name are populated only by neuroNCAP's
# patched engine -- see patches/neuro-ncap/0003-expose-current-actor-state-to-model.patch).
# Extending to an open-loop benchmark needs that benchmark's own ground-truth
# side channel first, not a change here.
benchmarks: [neuroncap]
