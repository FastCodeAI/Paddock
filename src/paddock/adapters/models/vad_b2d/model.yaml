name: vad_b2d
description: VAD-Base trained on Bench2Drive (Thinklab-SJTU Bench2DriveZoo) - the same planner, CARLA-trained, six CARLA commands
repo: Bench2DriveZoo

runtime:
  # The env uniad builds and shares, plus Bench2DriveZoo's own `mmcv` built in place (uniad_b2d/setup.sh).
  kind: conda
  python: "3.9"
  venv: "{repos}/.conda-envs/uniad-vad"
  # First on the path so the vendored `mmcv` shadows the env's mmcv-full; policy.py checks.
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  env:
    VAD_B2D_CONFIG: "{repo}/adzoo/vad/configs/VAD/VAD_base_e2e_b2d.py"
    # huggingface.co/rethinklab/Bench2DriveZoo, vad_b2d_base.pth
    VAD_B2D_CHECKPOINT: "{weights}/bench2drivezoo/vad_b2d_base.pth"
    # VAD_B2D_HORIZON_S (unset): continue the plan past its own 3 s by holding the last 0.5 s step, for
    # NAVSIM, which scores 4 s and refuses a shorter plan. An extrapolation the model never made, so it is
    # set per benchmark, in a [models.vad_b2d.benchmarks.navsim.env] pairing, and the report notes it.
    # VAD_B2D_HORIZON_S: "4.0"
    PYTHONNOUSERSITE: "1"
    MPLBACKEND: "Agg"
    OMP_NUM_THREADS: "2"
    # Frame-preparing threads beside the model's own, as uniad's model.yaml explains. Speed only.
    UNIAD_VAD_THREADS: "5"
  tuning_env: [UNIAD_VAD_THREADS]

capabilities:
  # Bench2DriveZoo's order (prepare_B2D.py CAMERAS, and its agents').
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]
  # Measured 2.8 GB for the process (1.6 GB allocated, 2.1 GB reserved peak).
  vram_gb: 4
  startup_timeout_s: 900
  waypoint_dt: 0.5
  # Trained on Bench2Drive's 10 Hz logs sampled every 5th frame; Bench2DriveZoo's agent asks it every 20 Hz
  # tick (docs/models/vad_b2d.md).
  planning_hz: 2.0

  # -- model card (docs/models/comparison.md) --
  architecture: "ResNet-50 + BEVFormer (200x200) with vectorised agent and map queries and an ego planning query"
  params_m: 58.4
  size_gb: 0.70
  precision: fp32
  input_size: [1280, 720]
  history_frames: 1
  camera_hz: 2.0
  output_kind: waypoints
  horizon_s: 3.0
  plan_points_hz: 2.0
  stochastic: false
  needs_speed: true
  trained_on:
    # Bench2Drive base less its validation clips (docs/DATA_PREP.md at the pinned sha); the ResNet-50 starts
    # from torchvision's ImageNet weights (pretrained=dict(img='ckpts/resnet50-19c8e357.pth')).
    - dataset: bench2drive
      split: base train
    - dataset: imagenet
# VAD_B2D_HORIZON_S changes what a NAVSIM score means. tests/test_report.py accepts a score note only once a
# stored run sets its key, so these two lines go in with the first stored NAVSIM run; until then such a
# run is stored valid: false:
#   score_notes:
#     VAD_B2D_HORIZON_S: "plan continued to {value} s by paddock; the model itself plans 3 s"
#   ranked_with_note: [VAD_B2D_HORIZON_S]

# Where it runs (docs/models/vad_b2d.md, "Benchmarks"): every benchmark that sends the six surround cameras.
# navsim and navsim_v1 need VAD_B2D_HORIZON_S = "4.0" (above). neuroncap asks every 0.1 s whatever
# planning_hz says; the policy steps the model every 0.5 s and holds its plan in between
# (bev_planners.held_plan). Not listed: comma2k19 sends one camera; alpasim's six-camera profile renders
# nuScenes' rig, not the CARLA rig this checkpoint was trained on (no alpasim.yaml).
benchmarks: [hugsim, nuscenes, bench2drive, kitscenes, nuplan, neuroncap, navsim, navsim_v1]
