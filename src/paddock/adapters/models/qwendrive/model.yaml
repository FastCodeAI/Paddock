name: qwendrive
description: Qwen-Drive-1.0-4B (Qwen team + HUST) - Qwen3.5-4B VLM with a 1B flow-matching planning expert
repo: Qwen-Drive-1.0

runtime:
  kind: uv
  python: "3.12"
  venv: "{repo}/.venv"
  # The package is importable from src/ without an install (docs/cookbook.md:3).
  pythonpath: ["{repo}/src"]
  cwd: "{repo}"
  env:
    QWENDRIVE_CHECKPOINT: "{weights}/Qwen-Drive-1.0-4B"
    # planner-sft plans in direct mode; planner-rl was reward-optimised only
    # under reasoning rollouts and the vendor says to run it in reasoning mode.
    # The adapter refuses the rl/direct pairing rather than record its number.
    #
    # These two reach run.json as config.declared_env and are hashed into the
    # run id, which matters because the vendor's published PDMS for the two
    # differs by 2.9 points. Runs made before that was recorded do
    # not say which planner produced them; `paddock doctor --model qwendrive`
    # and /diagnostics report it too.
    QWENDRIVE_PLANNER: "planner-sft"
    # direct, not reasoning. Reasoning is worth roughly 1.47 against 1.55 ADE on
    # comma2k19's city segment at about twice the latency -- and it is the one
    # thing here that is not reproducible, because the arithmetic under
    # `vlm.generate()` varies: five rollouts on a fixed input gave four
    # identical plans and one 0.64 m away at the 90 m end of the 5 s horizon.
    # Direct mode is bit-exact across the same five, which is what `stochastic`
    # below declares. QWENDRIVE_MODE=reasoning runs the other side.
    QWENDRIVE_MODE: "direct"
    QWENDRIVE_NUM_SAMPLES: "1"
    # One real camera per view slot: what the model was trained on, and what
    # every benchmark here but comma2k19 supplies. A side camera the source does
    # not have at all -- comma2k19's road camera is the only one it has -- gets
    # black frames, so a monocular source runs on this default too: the forward
    # camera in the forward slot, nothing invented for the sides, and the run's
    # diagnostics name the slots left black. `replicate` and the `crop` ablation
    # put the forward image in the side slots instead; they stay available for
    # comparison, ranked with the note below.
    QWENDRIVE_VIEWS: "ring"
    # flash-attn does not build for sm_120 on this toolchain (see setup.sh);
    # the model supports sdpa for both the VLM and the expert.
    QWENDRIVE_ATTN: "sdpa"

capabilities:
  # Exactly the three views the model was trained on (scene.py CAMERA_VIEWS).
  # A source may supply fewer: a side camera it does not have is left black.
  # Under QWENDRIVE_VIEWS=replicate|crop the policy declares CAM_FRONT alone and
  # fills the other two slots from it; this list is the ring-source default.
  cameras: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT]
  # 9.1 GB VLM + 2.1 GB expert in bf16, plus activations for ~4k vision tokens.
  vram_gb: 18
  # An 11 GB checkpoint read on a shared box.
  startup_timeout_s: 1800
  waypoint_dt: 0.5
  # No floor: the four camera frames are picked by timestamp 0.5 s apart, so
  # a 2 Hz source contributes every frame and a 10 Hz source every fifth.
  min_input_hz: 0.0
  # What it was built for: 16 ego poses at 0.1 s over 1.5 s (docs/data.md
  # hist_traj_10hz), which NAVSIM can supply from nuPlan (native_input_hz
  # above 2 selects the dense path); the frames stay 0.5 s apart either way.
  native_input_hz: 10.0
  history_s: 1.5

  # -- model card (docs/models/comparison.md) --
  architecture: "Qwen3.5-4B VLM + 1B flow-matching planning expert (planner-sft)"
  # Counted from the checkpoint, not the card: 4539 M in model.safetensors plus
  # 1040 M in planner-sft/. perception/ (125 M) is not loaded for planning.
  params_m: 5580
  size_gb: 11.2
  precision: bf16
  # Per-frame pixel budgets, not a fixed size: current frame ~720p
  # (921,600 px), the three history frames ~320p (174,080 px), each snapped
  # to a 32 px grid. 1280x720 is the current frame's budget at 16:9. Frames
  # carry no `target_size`, so a source's own aspect ratio is kept.
  input_size: [1280, 720]
  history_frames: 4
  # Camera frames 0.5 s apart, ego poses 0.1 s apart (policy.py FRAME_DT, HISTORY_DT).
  camera_hz: 2.0
  ego_history_steps: 16
  ego_history_hz: 10.0
  output_kind: waypoints
  # What the model emits, and now all of what the adapter hands paddock: the
  # 0.5 s grid (GRID_INDICES) carries all ten points rather than stopping at
  # 4 s. NAVSIM scores the first eight, neuroNCAP the first six and KITScenes
  # the first six, so the tail costs them nothing and lets comma2k19 score
  # ADE@5s at the same spacing every other model on that board is scored at.
  horizon_s: 5.0
  plan_points_hz: 10.0  # 50 poses 0.1 s apart
  # Flow matching from seeded noise (noise_seed + k) and a greedy reasoning
  # turn: in the default direct mode, repeated inference on identical input is
  # identical. QWENDRIVE_MODE=reasoning is not -- see the note there.
  stochastic: false
  needs_speed: true
  # Four stages, from the technical report (arXiv 2609.00111, sec. 2.2-2.3):
  # 1-2. The VLM, Qwen3.5-4B (its own corpus is not published), adapted with a BEV
  #      perception head on nuScenes' official train split and OpenScene trainval
  #      minus 16 held-out logs, plus 24 public driving-VQA sets ("We use training
  #      splits for these datasets", about 20 % of each) and 30K in-house examples
  #      from China. Some of those VQA training splits hold nuScenes val scenes
  #      (NuInstruct and Talk2Car together: 12 of neuroNCAP's 14), and one, Impromptu
  #      VLA, holds frames from 52 of navtest's 136 logs; which 20 % was sampled is
  #      not stated. See comparison.md, Qwen-Drive 1.0 x nuscenes and x navsim.
  # 3. The planning expert paddock runs (planner-sft), VLM frozen: NAVSIM,
  #    OpenScene, WOD-E2E and PhysicalAI-AV, no split named for any; navtrain is
  #    the assumption for NAVSIM.
  # 4. planner-rl, which paddock does not run: 15K navtrain, 15K PhysicalAI-AV and
  #    479 WOD-E2E validation scenarios.
  # KITScenes and comma2k19 are named nowhere in the report or its 24 VQA sources.
  trained_on:
    - dataset: qwen3.5
    - dataset: nuscenes
      split: train
    - dataset: navsim
      split: trainval
    - dataset: navsim
      split: navtrain
    - dataset: public-driving-qa
    - dataset: in-house-china
    - dataset: waymo-e2e
    - dataset: nvidia-physical-ai

# One key, not one per benchmark that arrives: two `benchmarks:` lines is valid
# YAML and keeps only the last, which is how a model has silently dropped off a
# board before.
# AlpaSim drives it through its driver profile (alpasim.yaml beside this file),
# which is what makes the node build its native AlpaSim inputs and return 50
# points 0.1 s apart there instead of the 0.5 s grid above (policy.py).
# Settings that change what a score means. The leaderboard prints the line under
# any ranked run that set one to something other than the declared default.
score_notes:
  QWENDRIVE_VIEWS: "one camera fills all three view slots ({value}); the model was trained on three real cameras"
# Of those, what a site may set and stay ranked, with the note: `replicate` and `crop`, kept for comparison.
ranked_with_note: [QWENDRIVE_VIEWS]

benchmarks: [kitscenes, nuscenes, navsim, navsim_v1, neuroncap, comma2k19, alpasim, hugsim]
