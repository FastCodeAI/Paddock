# How the AlpaSim benchmark drives Qwen-Drive through paddock's bridge.
#
# Read by adapters/benchmarks/alpasim/harness.py (profile_for). A model folder
# without this file is driven on the default profile. All four keys are
# required; an unknown or missing key fails the run with this file's name.
# See docs/adding-a-model.md, "AlpaSim settings".
#
# The settings of Qwen-Drive's native AlpaSim driver (adapter 0.1.4) -- four
# f-theta cameras at 20 Hz, 3.0 s warm-up with the driver called, 400 steps
# (paddock_bridge_qwendrive.yaml) -- and its inputs. The three cameras it reads
# are renamed to the node's names and the fourth is not sent. The node is asked
# every 1.5 s on a grid, as the native driver asked it, and hears every other
# tick through /observe, so its frames 0.5 s apart and ego rows 0.1 s apart all
# exist. canbus carries forward and sideways speed and yaw rate, with the forced
# replay's zeros replaced from the poses; the route and the scene id ride along
# for the node's command and noise seed. Plans come back as 50 points 0.1 s
# apart. Same 30 scenes as drivejepa.

# Driver config under adapters/benchmarks/alpasim/configs/driver/.
driver: paddock_bridge_qwendrive

# Extra bridge.py flags.
bridge_args:
  - --camera-name
  - camera_front_wide_120fov=CAM_FRONT
  - --camera-name
  - camera_cross_left_120fov=CAM_FRONT_LEFT
  - --camera-name
  - camera_cross_right_120fov=CAM_FRONT_RIGHT
  - --named-cameras-only
  # The native driver's replan period: 30 control steps.
  - --replan-every-us
  - "1500000"
  # Both must equal paddock_bridge_qwendrive.yaml's control step and
  # force_gt_duration_us; a test checks they do.
  - --frame-interval-us
  - "50000"
  - --force-gt-us
  - "3000000"
  # The node returns all 50 points it plans, 0.1 s apart, on AlpaSim.
  - --waypoint-dt
  - "0.1"
  - --observe-between-replans
  - --canbus-ego-frame
  - --send-route
  - --send-scene-id

# Under adapters/benchmarks/alpasim/scenes/: each scene pinned to one artifact.
scenes_csv: public_2601_30scenes_26p01.csv

# Write the bridge's per-replan log next to the run's samples.jsonl.
replan_log: true
