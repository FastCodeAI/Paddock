# How the AlpaSim benchmark drives UniAD through paddock's bridge.
#
# Read by adapters/benchmarks/alpasim/harness.py (profile_for). The four keys
# below are required; an unknown or missing key fails the run with this file's
# name. Without this file the model's cameras would never reach its node, and
# AlpaSim would refuse it before starting.
# See docs/adding-a-model.md, "AlpaSim settings".
#
# AlpaSim's six cameras re-rendered as nuScenes' rig: 1600 x 900 undistorted
# pinholes at nuScenes' own intrinsics and poses, every 0.5 s, the view straight
# back on the tele camera's id (paddock_bridge_nuscenes_rig.yaml), renamed to
# the six names the node reads. The node is asked every 0.5 s on a grid, its
# planning_hz, and the 50 ms steps between are answered from that plan; the
# 3.0 s warm-up goes to /observe, and the first plan steps through the warm-up
# frames on the 0.5 s grid. canbus carries velocity and acceleration where
# nuScenes' CAN bus has them. Same 30 scenes, warm-up and control step as
# drivejepa and autoe2e. VAD's profile (models/vad/alpasim.yaml) is this one;
# a test checks the two agree.
#
# No route is sent: the bridge's command is FOLLOW_REFERENCE, which these
# models read as FORWARD (bev_planners.NUSC_COMMAND), so they are never told
# to turn.

# Driver config under adapters/benchmarks/alpasim/configs/driver/, shared with vad.
driver: paddock_bridge_nuscenes_rig

# Extra bridge.py flags.
bridge_args:
  # AlpaSim id=the node's camera name, in the order the driver config renders
  # them; the tele camera's id carries CAM_BACK.
  - --camera-name
  - camera_front_wide_120fov=CAM_FRONT
  - --camera-name
  - camera_cross_left_120fov=CAM_FRONT_LEFT
  - --camera-name
  - camera_cross_right_120fov=CAM_FRONT_RIGHT
  - --camera-name
  - camera_rear_left_70fov=CAM_BACK_LEFT
  - --camera-name
  - camera_front_tele_30fov=CAM_BACK
  - --camera-name
  - camera_rear_right_70fov=CAM_BACK_RIGHT
  # Send each camera's pinhole K from start_session (any other lens is
  # refused); the node builds lidar2img from it and the pose the driver
  # config declares.
  - --pinhole-intrinsics
  # Ask the node every 0.5 s on a grid anchored on the scene's first step:
  # the temporal BEV fuses the previous grid as 0.5 s old. Steps between are
  # answered from the cached plan, re-timed and re-anchored, and warm-up steps
  # go to /observe (replan_rhythm.py). Must equal the driver config's camera
  # frame_interval_us, so every replan falls on a frame (a test checks).
  - --replan-every-us
  - "500000"
  # Both must equal paddock_bridge_nuscenes_rig.yaml's control step (not its
  # cameras' 500 ms) and force_gt_duration_us; a test checks they do.
  - --frame-interval-us
  - "50000"
  - --force-gt-us
  - "3000000"
  # canbus[13] / [14] carry the forward and sideways speed in the rig frame,
  # where nuScenes' CAN-bus vel is (ego frame; bev_planners.nuscenes_can_bus
  # copies 13:16), instead of [13] = the speed's magnitude; [12] stays the yaw
  # rate. The warm-up's reported zeros are replaced from the poses, so the
  # frames the first plan steps through carry the speed the car had.
  - --canbus-ego-frame
  # canbus[7] / [8] carry the simulator's forward and sideways acceleration,
  # where nuScenes' CAN-bus accel is; the adapter adds gravity to the zero
  # vertical (bev_planners.accel_with_gravity). Without it the model reads no
  # acceleration at all.
  - --canbus-acceleration
  # Not passed, on purpose:
  #   --observe-between-replans: after the warm-up the model steps only on the
  #     0.5 s grid, and history_on_grid drops a frame observed between two
  #     steps; it would cost six frames decoded per 50 ms step for nothing.
  #   --pad-ego-history: padded frames carry no images, and the first plan
  #     would step on the one 0.5 s before the scene's first frame and fail for
  #     want of six cameras.
  #   --waypoint-dt: the default, 0.5 s, is the models' own spacing.

# Under adapters/benchmarks/alpasim/scenes/: each scene pinned to one artifact.
scenes_csv: public_2601_30scenes_26p01.csv

# Write the bridge's per-replan log next to the run's samples.jsonl.
replan_log: true
