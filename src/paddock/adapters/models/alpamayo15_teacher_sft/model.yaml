name: alpamayo15_teacher_sft
description: Same teacher planner as `alpamayo15_teacher`, but declaring Alpamayo's full camera rig so SFT data collection renders what training actually needs
repo: alpamayo-scripts

runtime:
  kind: conda
  python: "3.10"
  venv: "{repos}/.conda-envs/ncap"
  pythonpath: ["{repo}/rl_training", "{repo}/rl_training/expert"]
  cwd: "{repo}/rl_training/expert"
  env:
    NUSCENES_DATAROOT: "{data.nuscenes}"
    NUSCENES_VERSION: "v1.0-trainval"
  env_passthrough:
    - EXPERT_RECORD_SFT_DIR

capabilities:
  # The only difference from `alpamayo15_teacher`: Alpamayo1.5 conditions on
  # three wide cameras (CAM_FRONT_LEFT/CAM_FRONT/CAM_FRONT_RIGHT -- see
  # adapters/models/alpamayo15/policy.py's CAMERA_SLOTS), not just CAM_FRONT.
  # `alpamayo15_teacher`'s own single-camera declaration is deliberate there
  # (wall-clock parity with vision models being scored), which is exactly
  # wrong for data collection -- this renders what training needs instead, as
  # its own registry entry rather than overloading the other one's meaning.
  cameras: [CAM_FRONT_LEFT, CAM_FRONT, CAM_FRONT_RIGHT]
  vram_gb: 0
  startup_timeout_s: 120
  waypoint_dt: 0.5

  architecture: "Hand-written Frenet-frame candidate planner (speed profiles x go-around laterals, scored with hard constraints + anti-freeze soft costs); no learned components"
  output_kind: waypoints
  horizon_s: 6.4
  stochastic: false
  needs_speed: true
  trained_on: []

benchmarks: [neuroncap]
