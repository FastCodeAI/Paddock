name: constant_velocity
description: Reference floor, not a model - holds the measured ego speed on a straight line

# No repo and no weights: the whole policy is four lines of arithmetic. It is
# here because a closed-loop score is unreadable without one. AlpaSim's
# scene_score, for instance, zeroes a scene on an at-fault collision or an
# offroad event -- and constant velocity commits neither, so it outscores three
# of the four real models on the pilot set. A number that surprising is only
# interpretable next to the floor that produces it.
# No upstream to clone: the whole policy is four lines of arithmetic.
repo: ""

runtime:
  kind: uv
  python: "3.11"

  # numpy and nothing else, so this venv is trivial -- but paddock launches
  # every model in its own interpreter and the floor is not a special case.
  # A site that would rather not keep a venv for four lines of arithmetic can
  # point [models.constant_velocity] venv at paddock's own, which already has
  # numpy; setup.sh exists so that is a choice rather than a requirement.
  venv: "{repos}/.venvs/constant_velocity"

  pythonpath: []
  cwd: ""
  env: {}

capabilities:
  # It never looks at an image. Declared anyway because the simulator renders
  # what a model declares, and declaring none has renderers to skip work that
  # the scored comparison assumes happened.
  cameras: [CAM_FRONT]
  vram_gb: 0
  startup_timeout_s: 60
  waypoint_dt: 0.5

  # -- model card (docs/models/comparison.md) --
  # There is no network here, so the fields that describe one are absent rather
  # than zero: `params_m: 0` would read as a measured parameter count, and the
  # range check would accept it. Absent says "not applicable"; 0 says "nothing".
  architecture: "None -- integrates the measured ego speed along a straight line"
  output_kind: waypoints
  # 6 waypoints at waypoint_dt 0.5, the closed-loop minimum.
  horizon_s: 3.0
  # Same speed in, same plan out. The floor is the one row in the matrix that
  # cannot move between seeds, which is part of why it is a usable reference.
  stochastic: false
  # Trained on nothing, so it cannot overlap any benchmark's data. That is the
  # property that makes it a floor rather than a competitor.
  trained_on: []

# comma2k19 belongs here and was missing: a run has been on that board since the
# benchmark landed, but `--model all` and `paddock render` walk the registry
# rather than the results directory, so the floor was absent from every figure
# it was supposed to anchor. A row nobody can see is not a reference.
# Settings that change what a score means. The leaderboard prints the line under
# any ranked run that set one to something other than the declared default.
score_notes:
  PADDOCK_CV_SPEED_M_S: "driven at a fixed {value} m/s, not the measured ego speed"

benchmarks: [alpasim, nuscenes, bench2drive, comma2k19, nuplan, hugsim]
