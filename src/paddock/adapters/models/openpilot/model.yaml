name: openpilot
description: comma.ai openpilot supercombo, run through tinygrad
repo: openpilot

runtime:
  kind: uv
  python: "3.12"
  venv: "{repo}/.venv"
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  env:
    # ffmpeg from openpilot's own venv, so the RGB -> NV12 conversion matches
    # the binary the recorded runs used.
    PADDOCK_FFMPEG: "{repo}/.venv/bin/ffmpeg"
    # Colon-separated search path, fastest tier first.
    KITSCENES_ROOTS: "{data.kitscenes.tiers}"

capabilities:
  cameras: [CAM_FRONT]
  # tinygrad's PC backend is CPU:LLVM -- supercombo does not touch the GPU.
  # The reservation covers the harness around it, not the model.
  vram_gb: 6
  startup_timeout_s: 600
  waypoint_dt: 0.5
  # supercombo infers ego motion from frame-to-frame change, so the observation
  # rate is load-bearing rather than a preference. neuroNCAP's scenarios were
  # rebuilt at 10 Hz for exactly this reason, and KITScenes feeds 0.1 s frames.
  # Fed 0.5 s steps it plans 0.3 m of travel in 4 s while doing 4.8 m/s -- a
  # parked car. Benchmarks slower than this refuse rather than record it.
  min_input_hz: 10.0

# NAVSIM is deliberately absent. The adapter is complete and the trajectory grid
# already matches NAVSIM's, but OpenScene is a 2 Hz dataset and supercombo needs
# 10 Hz to perceive motion at all (see min_input_hz above), so a score here would
# measure the rate gap. `paddock run --bench navsim --model openpilot` refuses
# with that explanation before loading the model, rather than silently doing nothing.
benchmarks: [kitscenes, neuroncap, bench2drive]
