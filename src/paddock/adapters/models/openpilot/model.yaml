name: openpilot
description: comma.ai openpilot supercombo, through tinygrad where available and onnxruntime otherwise
repo: openpilot

runtime:
  kind: uv
  python: "3.12"
  venv: "{repo}/.venv"
  pythonpath: ["{repo}"]
  cwd: "{repo}"
  env:
    # ffmpeg from openpilot's own venv, so the RGB -> NV12 conversion matches
    # the binary the recorded runs used.
    PADDOCK_FFMPEG: "{repo}/.venv/bin/ffmpeg"
    # Colon-separated search path, fastest tier first.
    KITSCENES_ROOTS: "{data.kitscenes.tiers}"
    # tinygrad picks its device at import, and on a box with an NVIDIA card
    # that is NV -- so "supercombo does not touch the GPU" (vram_gb 0 below,
    # several NAVSIM nodes) would otherwise rest on luck. openpilot's own build
    # compiles the pickles with DEV=CPU:LLVM (selfdrive/modeld/SConscript);
    # the node runs them on the same device, pinned here.
    DEV: "CPU:LLVM"
    # "auto" prefers openpilot's own tinygrad JIT -- upstream's exact execution
    # path -- and falls back to onnxruntime on the shipped ONNX files when the
    # JIT pickle is absent, which is the case on a machine with no GPU or an
    # unpopulated tinygrad_repo submodule. Set to "tinygrad" or "onnx" to pin it.
    #
    # The two are not identical and the difference is recorded in every run's
    # diagnostics: the tinygrad warp is compiled for one camera geometry
    # (1928x1208), so any other source has to be resampled into it first, while
    # the ONNX path builds its warp at the source's native resolution and
    # resamples nothing. That matters most for a small sensor -- comma2k19's
    # 1164x874 EON was previously upscaled 66 % and then warped back down.
    PADDOCK_OPENPILOT_BACKEND: "auto"
    # "small" (driving_supercombo, 61 MB) or "big" (big_driving_supercombo,
    # 766 MB, LFS-excluded by setup.sh unless PADDOCK_OPENPILOT_BIG=1).
    PADDOCK_OPENPILOT_MODEL: "small"
    # onnxruntime intra-op threads per policy node. The shipped graphs are
    # float16 and onnxruntime's CPU provider has no float16 kernels, so they run
    # ~45x slower there than the same graph widened to float32. If CPU
    # throughput matters, widen one with onnxruntime.transformers.float16
    # (convert_float_to_float16 in reverse) and point PADDOCK_OPENPILOT_ONNX at
    # the result.
    PADDOCK_OPENPILOT_THREADS: "8"

capabilities:
  cameras: [CAM_OP_ROAD, CAM_OP_WIDE, CAM_FRONT]   # comma-three rig: road cam -> img, wide cam -> big_img; CAM_FRONT = fallback for single-camera sources (KITScenes, neuroNCAP)
  # tinygrad's PC backend is CPU:LLVM -- supercombo does not touch the GPU, and
  # no benchmark process around it does either (the neuroNCAP renderer is its
  # own process with its own reservation). Zero is what lets NAVSIM run several
  # nodes of it: a model with a VRAM claim is treated as a GPU model and capped
  # at one, and one node is 50 s a scenario with the 4.8 s history.
  vram_gb: 0
  startup_timeout_s: 600
  waypoint_dt: 0.5
  # supercombo infers ego motion from frame-to-frame change, so the observation
  # rate is load-bearing rather than a preference. neuroNCAP's scenarios were
  # rebuilt at 10 Hz for exactly this reason, and KITScenes feeds 0.1 s frames.
  # Fed 0.5 s steps it plans 0.3 m of travel in 4 s while doing 4.8 m/s -- a
  # parked car. Benchmarks slower than this refuse rather than record it.
  min_input_hz: 10.0
  # supercombo's feature buffer holds 96 frames at its 20 Hz: 4.8 s. KITScenes
  # feeds exactly that (48 source frames at 10 Hz, emitted twice each), and a
  # benchmark with a real history should feed no less, or the first plan is
  # made from a half-filled buffer.
  history_s: 4.8

  # -- model card (docs/models/comparison.md) --
  architecture: "supercombo -- one ONNX graph, run through tinygrad"
  # Parameter count is not published by comma. size_gb is the file paddock
  # actually loads: driving_supercombo.onnx, 60,881,999 bytes. The other one in
  # that directory, big_driving_supercombo.onnx, needs an external AMD GPU and
  # is 1,757,355,221 bytes -- which is only ever seen as a 135-byte git-lfs
  # pointer here, so read the `size` line in the pointer, not the file length.
  size_gb: 0.061
  input_size: [512, 256]
  history_frames: 2
  output_kind: waypoints
  horizon_s: 10.0
  # The reason min_input_hz above is load-bearing rather than cautious: the
  # complete non-image input set is {desire_pulse, traffic_convention,
  # action_t}. There is no channel to tell supercombo how fast it is going, so
  # it infers ego motion from frame-to-frame change and reads a 2 Hz dataset as
  # a parked car. Not fixable in an adapter.
  needs_speed: false
  trained_on:
    # comma's internal fleet, ~6,670 h, not released.
    #
    # This used to say "no overlap with any paddock dataset". That stopped
    # being safe when comma2k19 was added: comma2k19 is comma's own released
    # fleet data, collected on the same two cars by the same device, and the
    # training corpus is not published segment by segment, so whether these
    # 2035 segments are inside it cannot be checked from outside comma. It is
    # declared as one dataset rather than two because asserting the overlap
    # would be as unverified as denying it; what the overlap would mean for
    # reading that column is in docs/models/comparison.md.
    - dataset: comma-fleet

# NAVSIM is measurable only with nuPlan's full-rate sensor data configured
# ([benchmarks.navsim] nuplan in paddock.toml): OpenScene is a 2 Hz subsample and
# supercombo needs 10 Hz to perceive motion at all (see min_input_hz above), so
# on OpenScene alone a score would measure the rate gap. Without that setting
# `paddock run --bench navsim --model openpilot` refuses with the explanation
# before loading the model, rather than silently recording the artefact.
# `navsim_v1` is not declared: no 10 Hz run under the v1 devkit yet, and the v1
# harness would need its own [benchmarks.navsim_v1] nuplan setting.
#
# comma2k19 needs no such setting: it is native 20 Hz, exactly supercombo's own
# input rate, so no frame-repeat trick is needed at all -- see
# docs/benchmarks/comma2k19.md.
benchmarks: [kitscenes, neuroncap, bench2drive, navsim, nuscenes, comma2k19, nuplan]
