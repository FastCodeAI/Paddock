# Copy this directory to adapters/models/<your-model>/ and edit.
#
# Paths use template variables only -- never a real path. They are expanded from
# the site's paddock.toml at launch:
#
#   {repo}     this model's clone, i.e. [roots.repos]/<repo below>
#   {repos}    the clone root itself
#   {weights}  [roots.weights]
#   {runs}     [roots.runs]
#   {data.NAME}        a dataset's resolved root
#   {data.NAME.tiers}  every tier, colon-joined (for search-path env vars)
#
# tests/test_portability.py fails the build if you write a real path here.

name: _template
description: One line. What the model is and who publishes it.

# Key in repos.yaml. `paddock setup` clones or adopts it.
repo: _template

runtime:
  # uv    -- pyproject + uv.lock in the repo; setup.sh runs `uv sync`
  # conda -- an environment.yml or an explicitly built env
  # shell -- anything else, including a compiled binary
  kind: uv

  python: "3.12"

  # The interpreter paddock launches. Must exist after setup.sh has run.
  venv: "{repo}/.venv"

  # Prepended to PYTHONPATH, in order.
  pythonpath:
    - "{repo}"

  # Working directory. Load-bearing for some repos: code that does
  # np.load("./data/foo.npy") only works from one place.
  cwd: "{repo}"

  # Extra environment. Use this to point the repo at data rather than editing
  # its source -- most repos already read an env var for exactly this.
  env: {}
    # EXAMPLE_DATA_ROOT: "{data.kitscenes}"

capabilities:
  # Only what infer() actually reads. Rendering unused cameras is the single
  # largest closed-loop cost, and the simulator renders what you declare here.
  cameras: [CAM_FRONT]

  # VRAM to reserve before starting. Paddock waits for headroom rather than
  # failing several minutes into a checkpoint read. 0 means CPU-only.
  vram_gb: 0

  # Generous enough for a cold checkpoint read on a contended box.
  startup_timeout_s: 600

  # Waypoint spacing the model plans at, seconds.
  waypoint_dt: 0.5

  # -- the model card ---------------------------------------------------
  # What the model IS, as opposed to how to launch it. `paddock list models`
  # prints it, and docs/models/comparison.md is where the values and their
  # provenance live. Omit anything nobody has measured: absent reads as "not
  # recorded", which is honest, where a zero would be a claim.

  # One line. Enough to tell two rows of the support matrix apart.
  architecture: ""

  # Millions of parameters, billions of MACs per forward pass, GB on disk.
  # params_m: 0
  # macs_g: 0
  # size_gb: 0
  # precision: fp32          # fp32 | bf16 | fp16 | int8 | mixed

  # Per-camera input, [width, height], and how many frames of history one
  # inference consumes. 1 means the current frame only.
  # input_size: [512, 256]
  # history_frames: 1

  # waypoints | controls | perception. Explains an `n/a` in an ADE column
  # without sending a reader to find the footnote: a model predicting lane
  # curvature and a lead object has no plan to measure a displacement against.
  output_kind: waypoints

  # Planning horizon, seconds. Omit where the output is not time-parameterised.
  # horizon_s: 4.0

  # True if repeated inference on identical input can differ. A single run of a
  # stochastic model is a draw, not a measurement -- one model here has sd 1.817
  # across seeds on a single scenario, so `--runs 1` measures nothing.
  stochastic: false

  # Whether ego speed reaches the model at all. Set false only if there is
  # genuinely no channel for it; that is what makes min_input_hz above
  # load-bearing rather than cautious.
  needs_speed: true

  # Datasets seen in training, so a benchmark scored on data the model trained
  # on can be marked as such. Name a datasets.yaml key where it is one; an
  # outside corpus is still worth recording, because "none of ours" is the
  # useful claim. A self-declaration, not a measurement -- nothing verifies it.
  #
  # An empty list means NOT RECORDED, which is a different claim from "trained
  # on nothing". Say which you mean.
  # trained_on:
  #   - dataset: nuscenes
  #     split: train

# Benchmarks this model is expected to work on. `paddock doctor` uses it to
# report coverage; it does not restrict what you can run.
benchmarks: []
