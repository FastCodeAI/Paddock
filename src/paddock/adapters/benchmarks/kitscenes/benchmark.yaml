name: kitscenes
description: KITScenes open-loop trajectory accuracy - ADE and FDE against the recorded future
mode: open_loop
dataset: kitscenes
metrics: [ade, fde@1s, fde@2s, fde@3s, longitudinal_mae, lateral_mae, inference_seconds]
primary_metric: ade
# Read beside ade by the regression gate: the along- and across-lane split
# says whether a change is speed or steering, and fde@3s where the plan ends.
terms: [longitudinal_mae, lateral_mae, fde@3s]
