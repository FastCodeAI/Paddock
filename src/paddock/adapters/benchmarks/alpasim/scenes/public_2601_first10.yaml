# The pinned 10-scene working set of AlpaSim's public_2601 suite.
#
# Pinned as an explicit list rather than re-derived from limit_to_first_n at run
# time: the suite is fetched from a remote index, and a suite that gains a scene
# would silently change which ten "the first ten" means. Two sites comparing
# numbers would then disagree with nothing to tell them apart -- the same reason
# repos.yaml pins a sha.
#
# sequences_sha256 in each run.json is the check that a run actually covered
# these; docs/benchmarks/alpasim.md explains how to read it.
suite: public_2601
selection: first 10 by scene_id, as limit_to_first_n=10 selects them
scenes:
- clipgt-01d503d4-449b-46fc-8d78-9085e70d3554
