      resolution_hw: [900, 1600]
      shutter_type: GLOBAL
    # CAM_BACK_RIGHT: yaw -112.5, pitch 0.7, roll -0.1 degrees.
    - logical_id: camera_rear_right_70fov
      rig_to_camera:
        translation_m: [1.05945173053, -0.46720294852, 1.55050857555]
