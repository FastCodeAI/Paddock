# @package _global_
# The driver AlpaSim composes when paddock serves Drive-JEPA through the bridge.
#
# Drive-JEPA's native AlpaSim driver (adapter 0.1.4b) was scored on its own
# simulation settings, not Alpamayo's, and its baseline numbers are only
# comparable to a run through paddock made on the same ones. So this profile does
# not inherit alpamayo_configs the way paddock_bridge.yaml does; every value
# below is the one that driver's runs resolved to (their wizard-config and
# eval-config, eval md5 68cf4aaa...), and `models/drivejepa/alpasim.yaml` selects this
# file only for the drivejepa model. Other models keep paddock_bridge.yaml.
#
# What the values are, briefly:
#   * one camera, camera_front_wide_120fov, rendered as an OpenCV pinhole
#     (fx = fy = 1545, principal point 960/560) at 1920x1080 -- the lens the
#     bridge reads its intrinsics from and refuses to guess past;
#   * 20 Hz for both the control step and the camera, so the newest frame is
#     the policy step's frame (they must be equal; nothing upstream checks);
#   * 3.0 s of ground-truth warm-up with the driver called throughout, which is
#     a whole number of Drive-JEPA's 0.5 s replan periods;
#   * 400 steps, which covers the whole ~19.8 s clip at 50 ms.

wizard:
  # driver is absent on purpose: the bridge is already listening.
  run_sim_services:
    ["renderer", "physics", "trafficsim", "controller", "runtime"]

  external_services:
    # Overridden per episode with the port the harness actually reserved; this
    # value only has to compose.
    driver:
      - "localhost:9200"

  debug_flags:
    # Containers join the host network, so localhost:<port> reaches the bridge.
    use_localhost: true

# Do NOT set `runtime.endpoints.driver.skip: true`. Combined with
# external_services it makes the runtime skip the driver entirely, and the run
# still exits 0 with a full metrics table that is not the model's.
runtime:
  simulation_config:
    force_gt_duration_us: 3_000_000
    # The driver is called during warm-up, as the baseline's was. Stated rather
    # than left to the schema default because the comparison depends on it.
    skip_driver_during_force_gt: false
    control_timestep_us: 50_000
    n_sim_steps: 400
    n_rollouts: 1
    ego_mask_rig_config_id: null
    cameras:
      - height: 1080
        width: 1920
        logical_id: camera_front_wide_120fov
        # Must equal control_timestep_us; see the header.
        frame_interval_us: 50_000
        shutter_duration_us: 30_000

  extra_cameras:
    - logical_id: camera_front_wide_120fov
      rig_to_camera:
        translation_m: [1.65897811, -0.01443456, 1.51539499]
        rotation_xyzw: [-0.49929397355810856, 0.5039939168301356, -0.4972939976976715, 0.49939397235113037]
      intrinsics:
        model: opencv_pinhole
        opencv_pinhole:
          focal_length: [1545.0, 1545.0]
          principal_point: [960.0, 560.0]
          # Rendered with this distortion, and -- as in the baseline -- not
          # undone before the model sees the frame: Drive-JEPA is handed the
          # pinhole matrix alone.
          radial: [-0.356123, 0.172545, -0.05231, 0.0, 0.0, 0.0]
          tangential: [-0.00213, 0.000464]
          thin_prism: [0.0, 0.0, 0.0, 0.0]
      resolution_hw: [1080, 1920]
      shutter_type: ROLLING_TOP_TO_BOTTOM
