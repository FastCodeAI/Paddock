name: navsim
description: NAVSIM v2 EPDMS on navtest - an open-loop score from re-simulating a 4 s plan on OpenScene's real scenes; not the navhard two-stage leaderboard protocol
# Open loop in the sense that matters: the dataset decides what happens next and
# errors do not compound. NAVSIM's scorer owns the iteration, which is why the
# harness subclasses ExternallyScoredBenchmark rather than OpenLoopBenchmark.
mode: open_loop
dataset: navsim
metrics:
  - epdms
  - no_at_fault_collisions
  - drivable_area_compliance
  - driving_direction_compliance
  - traffic_light_compliance
  - ego_progress
  - time_to_collision_within_bound
  - lane_keeping
  - history_comfort
  - two_frame_extended_comfort
primary_metric: epdms
# Which metric fills which term of NAVSIM v1's PDM score (paddock.metrics.pdm),
# so the regression gate lays every benchmark out in the same rows.
# EPDMS's own extras (DDC, TLC, LK, two-frame comfort) are not PDMS terms. With
# all five filled and no `score`, the gate composes a v1-shape pdm_style_score.
pdm:
  nc: no_at_fault_collisions
  dac: drivable_area_compliance
  ttc: time_to_collision_within_bound
  ep: ego_progress
  comfort: history_comfort
