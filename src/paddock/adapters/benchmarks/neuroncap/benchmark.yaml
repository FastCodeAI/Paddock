name: neuroncap
description: NeuroNCAP closed-loop safety scoring - a NeuRAD render drives the model into staged collisions
mode: closed_loop
dataset: nuscenes
metrics: [ncap_score, collision_rate, impact_speed, reference_speed]
primary_metric: ncap_score
# Which metric fills which term of NAVSIM v1's PDM score (paddock.metrics.pdm),
# so the regression gate lays every benchmark out in the same rows.
# Any collision, from the simulator. DAC, TTC, EP and C would need the actor and
# ego-pose files each run writes, which no scorer reads yet.
pdm:
  nc: collision_rate
