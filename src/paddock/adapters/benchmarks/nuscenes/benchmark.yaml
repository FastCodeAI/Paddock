name: nuscenes
description: nuScenes val open-loop planning - L2 error at 1/2/3 s and collision rate against the recorded future (UniAD/VAD protocol)
# Open loop: the log decides what happens next; the model plans from the real
# past (up to 2 s of keyframes) and its 3 s plan is compared with what the human
# drove. Reported both ways the literature does: values at exactly 1/2/3 s
# (UniAD's paper), and cumulative means up to each horizon (ST-P3/VAD; the
# *_uniad_* keys, a historical name).
mode: open_loop
dataset: nuscenes
metrics: [l2_1s, l2_2s, l2_3s, l2_avg, col_1s, col_2s, col_3s, col_avg, l2_uniad_1s, l2_uniad_2s, l2_uniad_3s, l2_uniad_avg, col_uniad_1s, col_uniad_2s, col_uniad_3s, col_uniad_avg, ade_3s, pdm_ep, pdm_comfort]
primary_metric: l2_avg
# Which metric fills which term of NAVSIM v1's PDM score (paddock.metrics.pdm),
# so the regression gate lays every benchmark out in the same rows.
# NC is a proxy: the plan's box overlapping a recorded box, any category, with
# no at-fault call. No map is loaded, so there is no DAC, and boxes carry no
# velocity, so there is no TTC.
pdm:
  nc: col_avg
  ep: pdm_ep
  comfort: pdm_comfort
