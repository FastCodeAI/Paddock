name: bench2drive
description: Bench2Drive closed-loop driving on CARLA 0.9.15 - the SJTU leaderboard's 220 short routes (Towns 12/13/15, 44 scenario types)
mode: closed_loop

# CARLA generates every scenario procedurally from the routes that ship with the
# Bench2Drive checkout, so there is no dataset. Where the checkout and CARLA
# live is set in [benchmarks.bench2drive] in paddock.toml. `paddock data fetch
# carla` downloads CARLA, and `paddock setup --bench bench2drive` clones this
# repo and builds the Python that drives CARLA (setup.sh).
dataset: ""
repo: Bench2Drive

# CARLA Leaderboard driving score = route_completion x infraction_penalty.
metrics: [driving_score, route_completion, infraction_penalty, collision_rate]
primary_metric: driving_score
# Which metric fills which term of NAVSIM v1's PDM score (paddock.metrics.pdm),
# so the regression gate lays every benchmark out in the same rows.
# Any collision, and route completion as EP (progress along the route, not
# against an expert). DAC would be `outside_route_lanes` and C the 20 Hz
# `metric_info.json`; both are written per route and not yet read.
pdm:
  nc: collision_rate
  ep: route_completion
