# The recorded human future: the privileged upper anchor for the scoring path
# (navsim v1 publishes 0.948 PDMS on navtest for it). Stored valid=false by
# nodeless.py; never a model. The fork's own human_agent cannot run (see
# docs/benchmarks/navsim.md).
_target_: paddock.adapters.benchmarks.navsim.agent.PaddockHumanAgent
_convert_: 'all'

trajectory_sampling:
  _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
  _convert_: 'all'
  time_horizon: 4
  interval_length: 0.5
