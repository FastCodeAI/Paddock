name: nuplan
description: nuPlan v1.1 open-loop trajectory accuracy - ADE and FDE against the recorded future, on the original 10 Hz camera logs
# Open loop: the dataset decides what happens next and errors do not compound.
# nuPlan's own devkit scores closed-loop in its simulator; this is deliberately
# the KITScenes question asked of nuPlan's logs, so the columns mean one thing.
mode: open_loop
dataset: nuplan
# inference_seconds is deliberately absent: score() does not time the call,
# so declaring it left a column blank in every record.
metrics: [ade, fde@1s, fde@2s, fde@3s, longitudinal_mae, lateral_mae]
primary_metric: ade
# Read beside ade by the regression gate: the along- and across-lane split
# says whether a change is speed or steering, and fde@3s where the plan ends.
terms: [longitudinal_mae, lateral_mae, fde@3s]
