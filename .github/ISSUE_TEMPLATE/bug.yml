name: Bug report
description: Something in Paddock does not do what its docs say.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: bash
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `paddock doctor`
      render: text
  - type: input
    id: commit
    attributes:
      label: Paddock commit
      description: The output of `git rev-parse --short HEAD`.
