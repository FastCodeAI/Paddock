# Videos the website shows, hosted outside git on Hugging Face. Each section of the page is
# left out while it has no entry. Every URL must be https; a path with no scheme is relative
# to `base`.
#
# `base` names one commit of the dataset, so the page shows exactly the files it was reviewed
# with. After uploading new videos, set it to the commit the upload made.
#
# Each benchmark's videos come from `python -m tools.site.videos <benchmark> --out DIR`, which
# writes the [[video]] entries to paste below; see that file for the steps. The dataset's
# card on Hugging Face credits each source dataset and states its licence. Whether Renesas
# may show these scenes is still to be confirmed with Renesas legal.
#
# The clip at the top of the page, beside the title, if there is one:
# [hero]
# src = "neuroncap/hero.mp4"
# poster = "neuroncap/hero.jpg"
# alt = "Every model driving the same neuroNCAP scene, side by side"

base = "https://huggingface.co/datasets/naren-fastcode/paddock-videos/resolve/be6054e5dd549d831e4e9ba40123a63d3b61d7c7/"

# One line under a benchmark's videos, for what a viewer would otherwise misread. In
# neuroNCAP scene 0108, OpenPilot and METEOR end 36 m and 51 m from the recorded path and
# still score 5.0.
[notes]
neuroncap = "neuroNCAP rebuilds each scene from one real recorded drive and adds the other car to it. It draws that car only roughly, and a model that drives far from the recorded path sees a smeared view. The score counts only collisions, so a drive like that can still score 5."

[[video]]
benchmark = "neuroncap"
title = "Oncoming car, scene 0923"
caption = "The hardest frontal scenario: the models average 2.0 of 5. Run 9 of 10, the most typical one."
src = "neuroncap/frontal-0923-run8.mp4"
poster = "neuroncap/frontal-0923-run8.jpg"

[[video]]
benchmark = "neuroncap"
title = "Car crossing from the side, scene 0278"
caption = "The hardest side scenario: the models average 1.6 of 5. Run 1 of 10, the most typical one."
src = "neuroncap/side-0278-run0.mp4"
poster = "neuroncap/side-0278-run0.jpg"

[[video]]
benchmark = "neuroncap"
title = "Stopped car ahead, scene 0966"
caption = "The hardest stationary scenario: the models average 2.5 of 5. Run 5 of 10, the most typical one."
src = "neuroncap/stationary-0966-run4.mp4"
poster = "neuroncap/stationary-0966-run4.jpg"

[[video]]
benchmark = "neuroncap"
title = "Car crossing from the side, scene 0108"
caption = "Where the models disagree most: their averages run from 0.0 to 5.0 of 5. Run 2 of 10, the most typical one."
src = "neuroncap/side-0108-run1.mp4"
poster = "neuroncap/side-0108-run1.jpg"

