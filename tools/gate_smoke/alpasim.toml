# AlpaSim smoke tier: 10 of the 50 scenes of public_2601 downloaded on shakaal (not of all 913),
# grouped by turn (left or right from 45 degrees of heading change over the clip)
# and speed band (left/fast 1, left/medium 2, left/slow 1, right/medium 2, straight/fast 24, straight/medium 13, straight/slow 7), every group the same share.
# The pool is what had been downloaded, not a random sample of the suite: the first
# ten of its list, twenty drawn for public_2601_30scenes, and twenty more. Thirty of
# them are the scenes behind the published 30-scene AlpaSim results.
# Run as the scene set public_2601_gate10 (adapters/benchmarks/alpasim/scenes/),
# which the smoke's derived config pins as [benchmarks.alpasim] scene_set, so a site
# whose own scene_set is another still runs these.
# Replaces the draw of 2026-10-22 (10 of all 913 at random, none of them downloaded).
#
# Drawn once, on 2026-10-27, by `python -m tools.gate_subsets alpasim` (seed 20261027): every
# group the same share, random within it (tools/gate_subsets.py has the rule). It must
# never be re-picked, re-drawn or edited to make a result look better: a gate whose
# subset moves can be steered. If it turns out to be wrong (a sample that cannot run,
# say), replace it in its own commit that says why, and re-run every baseline paired
# with it.

bench = "alpasim"
unit = "scene"
seed = 20261027
count = 10
scene_set = "public_2601_gate10"

