# AlpaSim smoke tier: 10 of the 913 scenes of public_2601, at random. Not
# grouped: no per-scene speed or turn is on hand without downloading all of them.
# Run as the scene set public_2601_gate10 (adapters/benchmarks/alpasim/scenes/),
# which the smoke's derived config pins as [benchmarks.alpasim] scene_set, so a site
# whose own scene_set is another still runs these.
#
# Drawn once, on 2026-10-22, by `python -m tools.gate_subsets alpasim` (seed 20261022): every
# group the same share, random within it (tools/gate_subsets.py has the rule). It must
# never be re-picked, re-drawn or edited to make a result look better: a gate whose
# subset moves can be steered. If it turns out to be wrong (a sample that cannot run,
# say), replace it in its own commit that says why, and re-run every baseline paired
# with it.

bench = "alpasim"
unit = "scene"
seed = 20261022
count = 10
scene_set = "public_2601_gate10"

[strata]
"public_2601" = ["clipgt-1c7e2423-77d7-40b6-bf26-f36fb8ebcf52", "clipgt-29f4242b-7ec5-45a6-b1bc-78f19417390b", "clipgt-29fb826a-9b22-4a1d-8e51-b8d5bee542e5", "clipgt-5775a998-77f9-472a-8d12-f2b036a4cfe8", "clipgt-6f4fc882-8c0b-4be0-9610-7b500d79c11a", "clipgt-7a3d8529-f5c4-445d-97ed-8303b2ece934", "clipgt-ad098ec4-eeab-4022-9cc6-fc91a9946027", "clipgt-fa1f799f-b2f3-48d7-a61b-e06c619a5514", "clipgt-fb6d1a18-16cd-45f2-b80d-fa963ff59de3", "clipgt-ffb26632-8c84-433e-bde2-9caf285d8090"]
