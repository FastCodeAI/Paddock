# AlpaSim smoke tier: the benchmark's own default set, public_2601_first10 (the first 10
# scenes of the public_2601 suite), pinned in
# src/paddock/adapters/benchmarks/alpasim/scenes/public_2601_first10.yaml. Copied here so
# the tier is one list; tests/test_gate.py fails if the two disagree.
#
# Run with no subset argument (the default set). `--scene` would be the natural filter,
# but AlpaSim's preflight refused every scene id until #81 fixed it (docs/gate.md).
#
# Fixed once, on 2026-10-16. It must never be re-picked, re-seeded or edited to make a
# result look better: a gate whose subset moves can be steered. If the subset turns
# out to be wrong (a scene that cannot run, say), replace it in its own commit that
# says why, and re-run every baseline paired with it.

bench = "alpasim"
unit = "scene"
rule = "public_2601_first10"
count = 10

[strata]
public_2601_first10 = [
