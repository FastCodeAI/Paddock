# AlpaSim smoke tier: the 10 drawn on 2026-10-27 (seed 20261027) from the 50 public_2601 scenes
# downloaded on shakaal, by turn and speed, with the ones AlpaSim's wizard could not run
# swapped on 2026-10-27 for runnable ones, same group or else same turn: they were not in
# public_2601_30scenes_26p01.csv, the scene list the driver profiles hand the wizard.
#   clipgt-68e53160-f9d1-4070-9434-bf50c55652d3 (left/slow) -> clipgt-bae463d3-655b-4b54-ac8e-1c982219d829 (left/medium)
#   clipgt-49e0ea24-2925-4fae-b590-3f725c1063d5 (right/medium) -> clipgt-cdd9448c-8808-46b1-85c1-883bcc5862ff (right/medium)
# The pool is what had been downloaded, not a random sample of the suite; the list's
# 30 scenes are the ones behind the published 30-scene AlpaSim results.
# Run as the scene set public_2601_gate10 (adapters/benchmarks/alpasim/scenes/),
# which the smoke's derived config pins as [benchmarks.alpasim] scene_set, so a site
# whose own scene_set is another still runs these.
#
# Drawn once, on 2026-10-27, by `python -m tools.gate_subsets alpasim` (seed 20261027): every
# group the same share, random within it (tools/gate_subsets.py has the rule). It must
# never be re-picked, re-drawn or edited to make a result look better: a gate whose
# subset moves can be steered. If it turns out to be wrong (a sample that cannot run,
# say), replace it in its own commit that says why, and re-run every baseline paired
# with it.

bench = "alpasim"
unit = "scene"
seed = 20261027
count = 10
scene_set = "public_2601_gate10"

[strata]
