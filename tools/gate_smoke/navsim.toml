# NAVSIM v2 smoke tier: 1,000 of navtest's 12,146 scenarios, stratified over its 136 logs.
#
# Rule: tools.gate.stratified_pick(strata, n=1000, seed=20261016, floor=2), strata = navtest's
# tokens grouped by log (the token -> log map of NavsimBenchmark._token_logs over the
# metric cache, restricted to the tokens navtest's scene filter declares). Every log gets
# its share of 1,000 by size and at least 2, the scorer's floor (MIN_SCENARIOS: two-frame
# extended comfort pairs frames within a log). Tokens within a log are a seeded sample.
#
# Run as `--limit 1000` plus PADDOCK_NAVSIM_OVERRIDES="train_test_split.scene_filter.tokens=[...]"
# (python -m tools.gate subset navsim --env PADDOCK_NAVSIM_OVERRIDES). Stored valid=false.
#
# Pair a smoke run only with a smoke run of this same list, never with a full navtest
# run: two-frame extended comfort compares each scenario with the next *scored* one in its
# log, and is not computed when that one is more than 0.55 s later (run_pdm_score.py,
# calculate_two_frame_extended_comfort). Which scenarios are scored therefore changes a
# token's EPDMS, so the same token can score differently here and in a full run.
#
# Fixed once, on 2026-10-16. It must never be re-picked, re-seeded or edited to make a
# result look better: a gate whose subset moves can be steered. If the subset turns
# out to be wrong (a scene that cannot run, say), replace it in its own commit that
# says why, and re-run every baseline paired with it.

bench = "navsim"
unit = "log"
seed = 20261016
rule = "stratified_pick(by log, n=1000, floor=2)"
count = 1000

