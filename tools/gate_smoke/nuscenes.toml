# nuScenes open-loop smoke tier: the first 30 of the 150 official val scenes, every
# scorable keyframe in them (1011 samples).
#
# Not a seeded or stratified draw, for a written reason: open-loop harnesses take no
# scene filter (`paddock run` passes --scene only to closed-loop benchmarks, and
# NuScenesBenchmark.samples has no scene argument), only --limit, which yields samples in
# val_scenes.json order. So the only fixed subset the harness can run is a prefix, and
# `--limit 1011` is exactly the anchors of these 30 scenes. The prefix covers boston-seaport
# (18 scenes) and singapore-onenorth (12), not queenstown or hollandvillage; a stratified
# choice would need a scene filter in the nuScenes adapter (docs/gate.md).
#
# Sample ids listed from the full drivejepa run 20261012T215049-798a0d (all 5,119), in the
# harness's order. Stored valid=false (--limit). Pairs with a full run directly.
#
# Fixed once, on 2026-10-16. It must never be re-picked, re-seeded or edited to make a
# result look better: a gate whose subset moves can be steered. If the subset turns
# out to be wrong (a scene that cannot run, say), replace it in its own commit that
# says why, and re-run every baseline paired with it.

bench = "nuscenes"
unit = "scene"
rule = "first 30 scenes of val_scenes.json"
count = 1011

[strata]
