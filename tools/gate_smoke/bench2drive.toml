# Bench2Drive smoke tier (closed-loop tier): 7 of the 50 routes this site's
# Bench2Drive results use, kept for separating models, not for covering every
# scenario type.
#
# The 50 are the routes_subset recorded in results/bench2drive/*/pooled50-40c29d24c37d542a-*
# (bench2drive220.xml route ids). Rule, applied to the 10 routes this subset held
# from 2026-10-16 (stratified_pick by scenario type, n=10, seed=20261016):
#   keep a route when the driving scores of the four systems driven without
#   assistance -- alpamayo15, drivejepa, qwendrive, visionpilot; one record each
#   per route in docs/benchmarks/bench2drive-speed-normalization.json, field
#   scores.score_composed -- have a population standard deviation of at least
#   12 points.
# OpenPilot is left out of the rule because 16 of its routes were driven with human
# resume assistance; the constant-velocity sweep because it is a floor, not a model.
#
# Why the change, on 2026-10-20: the first smoke (released Drive-JEPA, run
# 20261016T001452-8ab5d4) spent 240 min on the ten routes, 139 of them on the
# three this rule drops -- 3307 (sd 5.4, 29 min), 25857 (sd 6.1, 20 min) and 2084
# (sd 10.1, 90 min, timed out) -- where the four systems score within a few points
# of each other, so a candidate's run there separates little. The seven kept took
# 87 min in that run. All seven are in that run, so it stays this subset's baseline.
#
# Run as `--scene <the 7 ids>`. Stored valid=false (a route subset).
#
# can_ship = false, since 2026-10-21: seven routes detect only a large change. Paired
# route differences between two control rates of one model have a route-level sd of
# 13.6-30.4 driving-score points (bench2drive-native-rate.json against
# bench2drive-speed-normalization.json, 49-50 routes each), so at 7 routes the
# smallest drop found 80% of the time is 17-38 points. A REGRESSION that large is
# real and still fails the gate; a GAIN from so few routes is too likely to be chance
# to ship a checkpoint on.
#
# Fixed on 2026-10-20 by the rule above. It must never be re-picked, re-seeded or
# edited to make a result look better: a gate whose subset moves can be steered. If
# the subset turns out to be wrong (a route that cannot run, say), replace it in its
# own commit that says why, and re-run every baseline paired with it.

bench = "bench2drive"
can_ship = false
unit = "route"
rule = "the 2026-10-16 ten, kept where the four unassisted systems' driving scores have sd >= 12"
count = 7

[strata]
DynamicObjectCrossing = ["24211"]
InvadingTurn = ["3572"]
ParkingCutIn = ["18305"]
PedestrianCrossing = ["14194"]
SignalizedJunctionLeftTurn = ["3936"]
SignalizedJunctionRightTurn = ["26956"]
YieldToEmergencyVehicle = ["3364"]
