# KITScenes smoke tier: the whole benchmark, all 223 keyframes of the shared sample list
# over 140 scenes. Nothing is left out: 223 open-loop samples is already smoke-sized.
#
# Run with no subset argument; listed here so a run can be checked against it. Ids are
# KitscenesBenchmark._sample_id over the site's [benchmarks.kitscenes] sample_list.
# A full run is valid=true. It pairs with another run made with the same config; the gate
# checks, because the tracked legacy run used ground-truth commands and no ground offset.
#
# Fixed once, on 2026-10-16. It must never be re-picked, re-seeded or edited to make a
# result look better: a gate whose subset moves can be steered. If the subset turns
# out to be wrong (a scene that cannot run, say), replace it in its own commit that
# says why, and re-run every baseline paired with it.

bench = "kitscenes"
unit = "scene"
rule = "all"
count = 223

